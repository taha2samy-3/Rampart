apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: gitlab
spec:
  category: sast
  runtime: wasm
  description: 'GitLab security reports (schema v14/v15): SAST, secret detection,
    dependency and container scanning, DAST; the secret is hashed and never stored'
  detect:
    filenames:
    - gl-sast-report*.json
    - gl-secret-detection-report*.json
    - gl-dependency-scanning-report*.json
    - gl-container-scanning-report*.json
    - gl-dast-report*.json
    probes:
    - jsonHasKeys:
      - vulnerabilities
      - scan
  source:
    oci: ghcr.io/rampart-aspm/parsers/gitlab:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
