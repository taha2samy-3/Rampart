apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: grype
spec:
  category: sca
  runtime: wasm
  description: 'Grype JSON: vulnerability matches with their related identifiers'
  detect:
    filenames:
    - '*grype*.json'
    probes:
    - jsonHasKeys:
      - matches
      - source
  source:
    oci: ghcr.io/rampart-aspm/parsers/grype:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
