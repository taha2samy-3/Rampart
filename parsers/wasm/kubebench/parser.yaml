apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: kubebench
spec:
  category: compliance
  runtime: wasm
  description: Aqua Security kube-bench CIS Kubernetes benchmark report
  detect:
    filenames:
    - '*kube-bench*.json'
    probes:
    - jsonHasKeys:
      - Controls
      - Totals
  source:
    oci: ghcr.io/rampart-aspm/parsers/kubebench:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
