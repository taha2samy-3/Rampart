apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: prowler
spec:
  category: compliance
  runtime: wasm
  description: Prowler AWS/Azure/GCP cloud security and compliance report
  detect:
    filenames:
    - '*prowler*.json'
    - '*prowler*.ocsf.json'
    probes:
    - jsonHasKeys:
      - AssessmentStartTime
      - FindingUniqueId
  source:
    oci: ghcr.io/rampart-aspm/parsers/prowler:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
