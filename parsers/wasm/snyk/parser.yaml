apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: snyk
spec:
  category: sca
  runtime: wasm
  description: Snyk open source and container vulnerability report
  detect:
    filenames:
    - '*snyk*.json'
    probes:
    - jsonHasKeys:
      - vulnerabilities
      - packageManager
  source:
    oci: ghcr.io/rampart-aspm/parsers/snyk:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
