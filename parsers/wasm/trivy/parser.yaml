apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: trivy
spec:
  category: sca
  runtime: wasm
  description: 'Trivy JSON (schema 2): package vulnerabilities, secrets, misconfigurations,
    licenses'
  detect:
    filenames:
    - '*trivy*.json'
    probes:
    - jsonHasKeys:
      - SchemaVersion
      - Results
  source:
    oci: ghcr.io/rampart-aspm/parsers/trivy:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
