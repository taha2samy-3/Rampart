apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSLAPolicy
metadata:
  name: fedramp-vdr
spec:
  # FedRAMP Vulnerability Deviation Response (VDR): fast-track deadlines 4d / 14d / 30d / 90d
  matrix:
    critical: {critical: 4,  high: 4,   medium: 4,  low: 4}
    high:     {critical: 14, high: 14,  medium: 14, low: 14}
    medium:   {critical: 30, high: 30,  medium: 30, low: 30}
    low:      {critical: 90, high: 90,  medium: 90, low: 90}
  caps:
    kevDueDate: true
    maxDays: 90
  startFrom: firstSeen
  restartOnReactivation: true
  pauseDuringRiskAcceptance: true
