apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: gitlab
spec:
  category: sast
  runtime: wasm
  description: 'GitLab security reports (schema v14/v15): SAST, secret detection,
    dependency and container scanning, DAST; the secret is hashed and never stored'
  detect:
    filenames:
    - 'gl-*-report*.json'
    filenameWeight: 30
    reject:
    - '"runs"'
    - '"bomFormat"'
    - '"spdxVersion"'
    - '"packageManager"'
    rules:
    - allOf:
      - '"vulnerabilities"'
      - '"identifiers"'
      weight: 40
    - allOf:
      - '"scan"'
      anyOf:
      - '"analyzer"'
      - '"scanner"'
      weight: 25
    - anyOf:
      - 'security-report-schemas'
      weight: 20
    - anyOf:
      - '"location"'
      weight: 10
  source:
    oci: ghcr.io/rampart-aspm/parsers/gitlab:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
