apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: openvex
spec:
  category: vex
  runtime: wasm
  description: OpenVEX triage statements and exploitability assertions parser
  detect:
    filenames:
    - '*openvex*'
    - '*.vex.json'
    - '*.vex'
    contentTypes:
    - '*openvex*'
    filenameWeight: 50
    rules:
    - anyOf:
      - 'openvex.dev'
      weight: 70
    - allOf:
      - '"statements"'
      - '"vulnerability"'
      weight: 40
  source:
    oci: ghcr.io/rampart-aspm/parsers/openvex:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
