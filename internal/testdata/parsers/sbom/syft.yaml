apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMParser
metadata:
  name: sbom-syft
spec:
  format: syft
  runtime: wasm
  source:
    oci: ghcr.io/rampart-aspm/sbom-parsers/sbom-syft:v1
  description: Anchore Syft JSON streaming WASM SBOM reader (packages, licences and relationships)
  detect:
    filenames:
    - '*syft*.json'
    - '*.syft.json'
    contentTypes:
    - '*syft+json*'
    reject:
    - '"bomFormat"'
    - '"spdxVersion"'
    rules:
    - allOf:
      - '"artifacts"'
      - '"foundBy"'
      weight: 60
    - allOf:
      - '"artifacts"'
      - '"artifactRelationships"'
      weight: 60
    - anyOf:
      - '"syft"'
      weight: 30
  options:
    buildDependencyGraph: true
