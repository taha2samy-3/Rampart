apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-analyzer
  namespace: security-tools
  labels:
    app.kubernetes.io/name: sample-analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-analyzer
    spec:
      containers:
        - name: analyzer
          image: ghcr.io/rampart/analyzers/sample:latest
          ports:
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-analyzer-svc
  namespace: security-tools
  labels:
    app.kubernetes.io/name: sample-analyzer
spec:
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app.kubernetes.io/name: sample-analyzer
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterExternalAnalyzer
metadata:
  name: sample-analyzer
spec:
  enabled: true
  protocol: grpc
  service:
    name: sample-analyzer-svc
    namespace: security-tools
    port: 50051
  timeoutSeconds: 30
