version: '3'

tasks:
  default:
    desc: Run all quality checks (fmt, vet, lint, test)
    cmds:
      - task: check

  check:
    desc: Run formatting, vet, lint, and tests
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  fmt:
    desc: Check formatting
    cmds:
      - sh -c '[ -z "$(gofmt -l .)" ]'

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run unit tests with race detection
    cmds:
      - go test -v -race ./...

  build:
    desc: Build the single rampart binary
    cmds:
      - mkdir -p bin
      - go build -v -o bin/rampart ./cmd/rampart

  web:install:
    desc: Install the web UI dependencies (Bun)
    dir: web
    cmds:
      - bun install --frozen-lockfile

  web:build:
    desc: Build the web UI into web/dist (it is embedded in the Go binary)
    dir: web
    cmds:
      - bun --bun run build

  web:test:
    desc: Typecheck, lint and test the web UI
    dir: web
    cmds:
      - bun --bun run typecheck
      - bun --bun run lint
      - bun --bun run test
