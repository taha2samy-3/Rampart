<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Explainable risk score</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Default policy, worked example. Score = clamp(base + Σ factors, 0, 1000). Every factor is a CEL expression in a RiskPolicy.</text>
<text x="284" y="129" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">Base severity: high</text>
<rect x="300.0" y="110" width="296.0" height="28" rx="4" fill="#4353D6" stroke="#4353D6" stroke-width="0"/>
<text x="606.0" y="129" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">+400</text>
<text x="284" y="171" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">Listed in CISA KEV</text>
<rect x="596.0" y="152" width="222.0" height="28" rx="4" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="828.0" y="171" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">+300</text>
<text x="284" y="213" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">EPSS ≥ 0.5</text>
<rect x="818.0" y="194" width="111.0" height="28" rx="4" fill="#DC2626" stroke="#DC2626" stroke-width="0"/>
<text x="939.0" y="213" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">+150</text>
<text x="284" y="255" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">Internet-facing application</text>
<rect x="929.0" y="236" width="74.0" height="28" rx="4" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="1013.0" y="255" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">+100</text>
<text x="284" y="297" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">Handles PCI data</text>
<rect x="1003.0" y="278" width="59.2" height="28" rx="4" fill="#D97706" stroke="#D97706" stroke-width="0"/>
<text x="1072.2" y="297" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">+80</text>
<text x="284" y="339" font-size="13" font-weight="500" fill="#0F172A" text-anchor="end">Behind a WAF (compensating control)</text>
<rect x="1003.0" y="320" width="59.2" height="28" rx="4" fill="#16A34A" stroke="#16A34A" stroke-width="0"/>
<text x="1072.2" y="339" font-size="13" font-weight="700" fill="#0F172A" text-anchor="start">−80</text>
<text x="284" y="383" font-size="14" font-weight="700" fill="#0F172A" text-anchor="end">Risk score</text>
<rect x="300" y="362" width="703.0" height="32" rx="4" fill="#1E2A5E" stroke="#1E2A5E" stroke-width="0"/>
<text x="1013.0" y="384" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="start">950  →  band: critical</text>
<line x1="300" y1="432" x2="1040.0" y2="432" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="300.0" y1="427" x2="300.0" y2="437" stroke="#94A3B8" stroke-width="1.5"/>
<text x="300.0" y="454" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">0</text>
<line x1="522.0" y1="427" x2="522.0" y2="437" stroke="#94A3B8" stroke-width="1.5"/>
<text x="522.0" y="454" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">300</text>
<line x1="744.0" y1="427" x2="744.0" y2="437" stroke="#94A3B8" stroke-width="1.5"/>
<text x="744.0" y="454" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">600</text>
<line x1="892.0" y1="427" x2="892.0" y2="437" stroke="#94A3B8" stroke-width="1.5"/>
<text x="892.0" y="454" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">800</text>
<line x1="1040.0" y1="427" x2="1040.0" y2="437" stroke="#94A3B8" stroke-width="1.5"/>
<text x="1040.0" y="454" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">1000</text>
<text x="411.0" y="422" font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">low</text>
<text x="633.0" y="422" font-size="12" font-weight="700" fill="#2A3690" text-anchor="middle">medium</text>
<text x="818.0" y="422" font-size="12" font-weight="700" fill="#8A4B04" text-anchor="middle">high</text>
<text x="966.0" y="422" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle">critical</text>
<text x="600" y="476" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">The band selects the SLA. A KEV due date caps it. Scores recompute when intelligence or asset context changes, without a rescan.</text>
</svg>
