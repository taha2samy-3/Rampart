<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="758.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Connector lifecycle</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">A connector is a resource. The operator is the only reader of its Secret; the UI reads and validates, and never writes.</text>
<rect x="40" y="90" width="300" height="250" rx="12" fill="#FFFFFF" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="112" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start">Git · kubectl · rampart apply -f</text>
<rect x="60" y="130" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="190.0" y="156.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Connector</text>
<text x="190.0" y="173.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">type · config</text>
<text x="190.0" y="190.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">secret references only</text>
<rect x="60" y="236" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="190.0" y="262.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Secret</text>
<text x="190.0" y="279.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">the values</text>
<text x="190.0" y="296.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">never in the API or the UI</text>
<rect x="410" y="130" width="310" height="182" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="565.0" y="192.0" font-size="14" font-weight="700" fill="#8A4B04" text-anchor="middle">operator</text>
<text x="565.0" y="209.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">validates the resource</text>
<text x="565.0" y="226.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">allowlist scoped to tenant + type (D77)</text>
<text x="565.0" y="243.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">copies the Secret, encrypted</text>
<text x="565.0" y="260.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">runs Check() → Connected</text>
<polyline points="320,168 410,168" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<polyline points="320,274 410,274" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="800" y="130" width="360" height="182" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="980.0" y="200.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">PostgreSQL</text>
<text x="980.0" y="217.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">connector rows (row-level security)</text>
<text x="980.0" y="234.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">secret_material (AES-256-GCM)</text>
<text x="980.0" y="251.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">status: Ready · Connected · reason</text>
<polyline points="720,221 800,221" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<text x="760" y="211" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">write</text>
<rect x="40" y="368" width="680" height="130" rx="12" fill="#EEF0FF" fill-opacity="0.35" stroke="#4353D6" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="390" font-size="13" font-weight="700" fill="#2A3690" text-anchor="start">Read path</text>
<rect x="60" y="404" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="190.0" y="430.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Web UI catalogue</text>
<text x="190.0" y="447.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">edit a resource, copy it</text>
<text x="190.0" y="464.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">no Save, no secret field</text>
<rect x="410" y="404" width="290" height="76" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="555.0" y="430.0" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">query-api</text>
<text x="555.0" y="447.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">GET /connectors · /catalogue</text>
<text x="555.0" y="464.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">POST /connectors/validate (dry run)</text>
<polyline points="320,442 410,442" fill="none" stroke="#4353D6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-read)" marker-start="url(#a-read)"/>
<polyline points="700,442 980,442 980,312" fill="none" stroke="#4353D6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-read)"/>
<text x="840" y="432" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">reads; never writes a connector (D82)</text>
<rect x="40" y="526" width="1120" height="110" rx="12" fill="#E6FAF8" fill-opacity="0.35" stroke="#0E9F9A" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="548" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="start">Sending</text>
<rect x="410" y="556" width="290" height="64" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="555.0" y="584.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">notify · ticket sweeper</text>
<text x="555.0" y="601.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">SafeClient.Scoped(tenant, type)</text>
<rect x="800" y="556" width="340" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="970.0" y="584.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Jira · GitHub · Slack · Teams · email · webhook</text>
<text x="970.0" y="601.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">checked before sending and at dial time</text>
<polyline points="1100,312 1100,350 1180,350 1180,520 555,520 555,556" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="880" y="512" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">config + its own secret, per call</text>
<polyline points="700,588 800,588" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="40" y="654" width="1120" height="90" rx="12" fill="#FEF3C7" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="676" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="start">Receiving (two-way Jira and GitHub only)</text>
<rect x="800" y="676" width="340" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="970.0" y="700.5" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Jira · GitHub webhook</text>
<text x="970.0" y="716.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">signed with the connector's webhook secret</text>
<rect x="410" y="676" width="290" height="56" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="555.0" y="700.5" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">ingest-gateway</text>
<text x="555.0" y="716.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /hooks/{type}/{connectorId}  (D78)</text>
<polyline points="800,704 700,704" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<text x="60" y="700" font-size="12" font-weight="400" fill="#475569" text-anchor="start">tenant read from the row, never the path;</text>
<text x="60" y="718" font-size="12" font-weight="400" fill="#475569" text-anchor="start">a resolution becomes a request, never a decision (D27)</text>
</svg>
