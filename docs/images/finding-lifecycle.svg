<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="588.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Finding lifecycle</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">States use the OpenVEX vocabulary. not_affected, risk_accepted, out_of_scope and duplicate are never reopened by a rescan.</text>
<polyline points="24,270 80,270" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="50" y="262" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">ingest</text>
<rect x="80" y="240" width="150" height="60" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="155.0" y="266.5" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">open</text>
<text x="155.0" y="283.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">new, untriaged</text>
<rect x="310" y="240" width="190" height="60" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="405.0" y="266.5" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">under_investigation</text>
<text x="405.0" y="283.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">being triaged</text>
<rect x="590" y="240" width="150" height="60" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="665.0" y="266.5" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">affected</text>
<text x="665.0" y="283.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">confirmed</text>
<rect x="960" y="240" width="170" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="1045.0" y="266.5" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">fixed</text>
<text x="1045.0" y="283.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">closed</text>
<rect x="590" y="100" width="200" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="690.0" y="126.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">not_affected</text>
<text x="690.0" y="143.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">+ one of 5 justifications</text>
<rect x="590" y="380" width="200" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="690.0" y="406.5" font-size="14" font-weight="700" fill="#8A4B04" text-anchor="middle">risk_accepted</text>
<text x="690.0" y="423.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">time-boxed · SLA paused</text>
<rect x="900" y="100" width="240" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1020.0" y="126.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">out_of_scope · duplicate</text>
<text x="1020.0" y="143.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">manual, from any active state</text>
<polyline points="230,270 310,270" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<polyline points="500,270 590,270" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<polyline points="740,270 960,270" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="850" y="262" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">rescan no longer reports it</text>
<polyline points="405,240 405,130 590,130" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="498" y="122" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">false positive or unreachable</text>
<polyline points="405,300 405,410 590,410" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="498" y="402" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">accept with expiry</text>
<polyline points="740,250 900,150" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<polyline points="690,440 690,500 175,500 175,300" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<text x="430" y="492" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">expiry → open again</text>
<polyline points="1045,300 1045,548 125,548 125,300" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-warn)"/>
<text x="585" y="540" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">seen again by a rescan → reactivated (unless doNotReactivate)</text>
</svg>
