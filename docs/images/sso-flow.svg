<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="658.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">SSO login flow (OIDC, backend-for-frontend)</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The browser only ever holds an HttpOnly session cookie. Tokens stay on the server.</text>
<rect x="55" y="86" width="190" height="44" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="150.0" y="113.0" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">Browser (SPA)</text>
<line x1="150" y1="130" x2="150" y2="606" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="385" y="86" width="190" height="44" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="480.0" y="113.0" font-size="14" font-weight="700" fill="#0B5E5B" text-anchor="middle">query-api</text>
<line x1="480" y1="130" x2="480" y2="606" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="725" y="86" width="190" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="820.0" y="113.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Identity provider</text>
<line x1="820" y1="130" x2="820" y2="606" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="985" y="86" width="190" height="44" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="1080.0" y="113.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">PostgreSQL</text>
<line x1="1080" y1="130" x2="1080" y2="606" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/>
<polyline points="150,166 480,166" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="315.0" y="158" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">1 · GET /auth/login?return_to=…</text>
<polyline points="480,206 150,206" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="315.0" y="198" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">2 · 302 to IdP with state, nonce, PKCE challenge</text>
<polyline points="150,246 820,246" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="650" y="238" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">3 · authorization request (code flow)</text>
<polyline points="820,286 150,286" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="650" y="278" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">4 · sign-in + MFA, then 302 with code</text>
<polyline points="150,326 480,326" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="315.0" y="318" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">5 · GET /auth/oidc/&lt;idp&gt;/callback?code&amp;state</text>
<polyline points="480,366 820,366" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="650.0" y="358" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">6 · token exchange (code + PKCE verifier)</text>
<polyline points="820,406 480,406" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="650.0" y="398" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">7 · ID token, refresh token</text>
<rect x="340" y="424" width="280" height="48" rx="8" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.2"/>
<text x="480" y="444" font-size="12" font-weight="500" fill="#0B5E5B" text-anchor="middle">validate signature, iss, aud, nonce</text>
<text x="480" y="462" font-size="12" font-weight="500" fill="#0B5E5B" text-anchor="middle">map claims → user and teams (JIT)</text>
<polyline points="480,500 1080,500" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="780.0" y="492" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">8 · create session row</text>
<polyline points="480,540 150,540" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="315.0" y="532" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">9 · Set-Cookie __Host-rampart_session (HttpOnly) + 302</text>
<polyline points="150,580 480,580" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="315.0" y="572" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">10 · API calls: cookie + X-CSRF-Token</text>
<text x="600" y="636" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Also supported: SAML 2.0 · SCIM 2.0 provisioning · CI OIDC federation · API tokens · Kubernetes ServiceAccount tokens · device flow for the CLI</text>
</svg>
