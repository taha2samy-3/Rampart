<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">CI federation</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">A pipeline exchanges its own OIDC token for a 15-minute ingest token bound to its run. No stored secret.</text>
<rect x="40" y="110" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="145.0" y="146.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">CI job</text>
<text x="145.0" y="162.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">GitHub Actions or GitLab CI</text>
<text x="145.0" y="178.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">ID token: repository_id,</text>
<text x="145.0" y="194.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">ref, sha, jti</text>
<rect x="310" y="110" width="250" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="435.0" y="154.0" font-size="14" font-weight="700" fill="#0B5E5B" text-anchor="middle">ingest-gateway</text>
<text x="435.0" y="170.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /ingest/v1/t/{tenant}/token</text>
<text x="435.0" y="186.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">RFC 8693 token exchange</text>
<polyline points="250,165 310,165" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="620" y="96" width="260" height="138" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="750.0" y="130.0" font-size="14" font-weight="700" fill="#8A4B04" text-anchor="middle">verify</text>
<text x="750.0" y="146.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">RS256 / ES256 only</text>
<text x="750.0" y="162.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">issuer must have a trust rule</text>
<text x="750.0" y="178.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">keys fetched SSRF-safe, cached</text>
<text x="750.0" y="194.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">audience rampart:&lt;host&gt;:&lt;tenant&gt;</text>
<text x="750.0" y="210.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">immutable ids · jti once</text>
<polyline points="560,165 620,165" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="940" y="96" width="220" height="138" rx="10" fill="#2A3690" stroke="#1E2A5E" stroke-width="1.5"/>
<text x="1050.0" y="138.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">ingest token</text>
<text x="1050.0" y="154.0" font-size="11" font-weight="400" fill="#DBE1FF" text-anchor="middle">role ingest · 15 minutes</text>
<text x="1050.0" y="170.0" font-size="11" font-weight="400" fill="#DBE1FF" text-anchor="middle">bound to the scan source</text>
<text x="1050.0" y="186.0" font-size="11" font-weight="400" fill="#DBE1FF" text-anchor="middle">bind: repo · ref · sha (D80)</text>
<text x="1050.0" y="202.0" font-size="11" font-weight="400" fill="#DBE1FF" text-anchor="middle">options: min_sev · no_close</text>
<polyline points="880,165 940,165" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="40" y="270" width="1120" height="300" rx="12" fill="#F1F5F9" fill-opacity="0.35" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="292" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start">What the token can do (red: refused)</text>
<rect x="70" y="316" width="330" height="104" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="235.0" y="341.0" font-size="14" font-weight="700" fill="#0B5E5B" text-anchor="middle">upload a report</text>
<text x="235.0" y="357.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /reports · /sbom (direct)</text>
<text x="235.0" y="373.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /uploads (presigned)</text>
<text x="235.0" y="389.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">context must match the token;</text>
<text x="235.0" y="405.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">empty fields are filled from it</text>
<rect x="440" y="312" width="330" height="104" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="605.0" y="345.0" font-size="14" font-weight="700" fill="#0B5E5B" text-anchor="middle">parse and merge</text>
<text x="605.0" y="361.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the token's options travel on the upload</text>
<text x="605.0" y="377.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">and reach the parse worker (D81)</text>
<text x="605.0" y="393.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">closing only on tracked refs (D10)</text>
<polyline points="400,364 440,364" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="810" y="312" width="320" height="104" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="970.0" y="353.0" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">query-api</text>
<text x="970.0" y="369.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">POST /api/v1/gate only</text>
<text x="970.0" y="385.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">every other route answers 403 (D81)</text>
<rect x="70" y="446" width="330" height="96" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="235.0" y="491.0" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">branch=main from a feature branch</text>
<text x="235.0" y="507.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">403: the ref is the token's</text>
<rect x="440" y="446" width="330" height="96" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="605.0" y="491.0" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">another repository or commit</text>
<text x="605.0" y="507.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">403: refused, nothing stored</text>
<rect x="810" y="446" width="320" height="96" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="970.0" y="483.0" font-size="14" font-weight="700" fill="#7F1D1D" text-anchor="middle">list findings or export</text>
<text x="970.0" y="499.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">403: an ingest token writes,</text>
<text x="970.0" y="515.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">it does not read the tenant</text>
<polyline points="1050,234 1050,252 370,252 370,316" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="640" y="246" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">used as Bearer rpt_… on the calls below</text>
</svg>
