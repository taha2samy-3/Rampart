<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Ingestion pipeline</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">From an uploaded report to triaged, scored findings. The label above each step is the target that runs it.</text>
<text x="112" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">ingest-gateway</text>
<rect x="30" y="116" width="165" height="110" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="112.5" y="150.0" font-size="13" font-weight="700" fill="#2A3690" text-anchor="middle">1 · Upload</text>
<text x="112.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">POST /uploads</text>
<text x="112.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">presigned PUT to S3</text>
<text x="112.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">complete + sha256</text>
<polyline points="195,171 225,171" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="307" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="225" y="116" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="307.5" y="150.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">2 · Detect and parse</text>
<text x="307.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">format sniffing</text>
<text x="307.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">streaming parser</text>
<text x="307.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">→ RawFinding</text>
<polyline points="390,171 420,171" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="502" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="420" y="116" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="502.5" y="150.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">3 · Normalize</text>
<text x="502.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CVE · CWE · purl · CPE</text>
<text x="502.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">paths · severity</text>
<text x="502.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">taxonomy mapping</text>
<polyline points="585,171 615,171" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="697" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="615" y="116" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="697.5" y="150.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">4 · Fingerprint</text>
<text x="697.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">finding_key from</text>
<text x="697.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">DedupPolicy fields</text>
<text x="697.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">+ correlation_key</text>
<polyline points="780,171 810,171" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="892" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="810" y="116" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="892.5" y="150.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">5 · Stage</text>
<text x="892.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">COPY batches into</text>
<text x="892.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">occurrence_staging</text>
<text x="892.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">≤ 5 000 rows per tx</text>
<polyline points="975,171 1005,171" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="1087" y="108" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="1005" y="116" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="1087.5" y="150.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">6 · Merge</text>
<text x="1087.5" y="167.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">INSERT … ON CONFLICT</text>
<text x="1087.5" y="184.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">(tenant, finding_key)</text>
<text x="1087.5" y="201.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">one statement per batch</text>
<text x="1087" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">parser</text>
<rect x="1005" y="296" width="165" height="110" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="1087.5" y="330.0" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">7 · Reimport close</text>
<text x="1087.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">absent in this run</text>
<text x="1087.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">→ fixed</text>
<text x="1087.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">never on a failed run</text>
<polyline points="1005,351 975,351" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="892" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">enrich</text>
<rect x="810" y="296" width="165" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="892.5" y="330.0" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">8 · Enrich</text>
<text x="892.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">alias graph</text>
<text x="892.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CVSS · EPSS · KEV</text>
<text x="892.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">fixed versions</text>
<polyline points="810,351 780,351" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="697" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">policy</text>
<rect x="615" y="296" width="165" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="697.5" y="330.0" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">9 · Score and SLA</text>
<text x="697.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">RiskPolicy factors</text>
<text x="697.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">band → SLAPolicy</text>
<text x="697.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">due date, KEV cap</text>
<polyline points="615,351 585,351" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="502" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">policy</text>
<rect x="420" y="296" width="165" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="502.5" y="330.0" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">10 · Policies</text>
<text x="502.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CEL automation</text>
<text x="502.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">auto-triage · routing</text>
<text x="502.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">exceptions</text>
<polyline points="420,351 390,351" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="307" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">policy</text>
<rect x="225" y="296" width="165" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="307.5" y="330.0" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">11 · Read models</text>
<text x="307.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">application_summary</text>
<text x="307.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">trend_daily</text>
<text x="307.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">→ query-api and UI</text>
<polyline points="225,351 195,351" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="112" y="288" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">notify</text>
<rect x="30" y="296" width="165" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="112.5" y="330.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">12 · Notify</text>
<text x="112.5" y="347.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">tickets · chat</text>
<text x="112.5" y="364.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">webhooks · events</text>
<text x="112.5" y="381.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">CI gate result</text>
<polyline points="1087,226 1087,280" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="140" y="463" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Every run reports</text>
<rect x="260" y="440" width="150" height="36" rx="18.0" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.2"/>
<text x="335.0" y="462.32" font-size="12" font-weight="600" fill="#2A3690" text-anchor="middle">created</text>
<rect x="430" y="440" width="150" height="36" rx="18.0" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.2"/>
<text x="505.0" y="462.32" font-size="12" font-weight="600" fill="#0B5E5B" text-anchor="middle">updated</text>
<rect x="600" y="440" width="150" height="36" rx="18.0" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="675.0" y="462.32" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">untouched</text>
<rect x="770" y="440" width="150" height="36" rx="18.0" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
<text x="845.0" y="462.32" font-size="12" font-weight="600" fill="#8A4B04" text-anchor="middle">reactivated</text>
<rect x="940" y="440" width="150" height="36" rx="18.0" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
<text x="1015.0" y="462.32" font-size="12" font-weight="600" fill="#14532D" text-anchor="middle">closed</text>
<text x="600" y="520" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Parsers are pure functions with no database access. Every step after upload is an idempotent River job.</text>
</svg>
