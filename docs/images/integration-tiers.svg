<polyline points="250,516 1166,516" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="708" y="508" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">more effort, more capability</text>
<text x="600" y="542" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">The core owns scheduling, retries, rate limits, secrets, tenancy and audit. An integration only translates.</text>
