<text x="360.0" y="143.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">no work</text>
<text x="360.0" y="160.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">anyone</text>
<rect x="482" y="96" width="220" height="84" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
