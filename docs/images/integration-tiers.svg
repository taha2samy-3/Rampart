<rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Integration tiers</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Three kinds of integration, four levels of effort. Every tier implements the same contracts and passes the same conformance kit.</text>
<rect x="250" y="96" width="220" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
