<text x="824.0" y="160.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">platform admin, signed</text>
<rect x="946" y="96" width="220" height="84" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="1056.0" y="126.0" font-size="14" font-weight="700" fill="#2A3690" text-anchor="middle">3 · Built-in Go</text>
