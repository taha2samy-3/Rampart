<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="618.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Dependency-Track sync and settling</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">BOM_PROCESSED arrives before the analysis. Rampart waits for the analysis, read from the project, then reads once.</text>
<rect x="40" y="90" width="1120" height="170" rx="12" fill="#F1F5F9" fill-opacity="0.35" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="112" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start">Dependency-Track 4.x (order read from the 4.14.6 sources)</text>
<rect x="70" y="140" width="230" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="185.0" y="181.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">BOM uploaded</text>
<text x="185.0" y="198.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">by the pipeline (v1)</text>
<polyline points="300,185 340,185" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<rect x="340" y="140" width="230" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="455.0" y="181.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">BOM processed</text>
<text x="455.0" y="198.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">BOM_PROCESSED sent</text>
<polyline points="570,185 610,185" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<rect x="610" y="140" width="230" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="725.0" y="181.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">vulnerability analysis</text>
<text x="725.0" y="198.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">runs after the notification</text>
<polyline points="840,185 880,185" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<rect x="880" y="140" width="230" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="995.0" y="181.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">analysis ends</text>
<text x="995.0" y="198.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">sets lastVulnerabilityAnalysis</text>
<text x="1060" y="108" font-size="12" font-weight="500" fill="#475569" text-anchor="end">no 'analysis complete' event exists</text>
<rect x="40" y="300" width="1120" height="290" rx="12" fill="#E6FAF8" fill-opacity="0.35" stroke="#0E9F9A" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="54" y="322" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="start">Rampart sync target (designed; not wired into the server yet, docs/23 K5)</text>
<rect x="70" y="350" width="230" height="96" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="185.0" y="386.5" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">/hooks/dependency-track/{id}</text>
<text x="185.0" y="402.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Bearer secret, constant time</text>
<text x="185.0" y="418.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">payload only a hint</text>
<polyline points="455,230 455,280 185,280 185,350" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<text x="320" y="272" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">webhook</text>
<rect x="340" y="350" width="230" height="96" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="455.0" y="386.5" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">trailing debounce</text>
<text x="455.0" y="402.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a burst gives at most</text>
<text x="455.0" y="418.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">one more sync</text>
<polyline points="300,398 340,398" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="610" y="350" width="250" height="96" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="735.0" y="378.5" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">wait until settled</text>
<text x="735.0" y="394.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">lastVulnerabilityAnalysis</text>
<text x="735.0" y="410.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">≥ lastBomImport (D84)</text>
<text x="735.0" y="426.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">bound reached → unsettled</text>
<polyline points="570,398 610,398" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="900" y="350" width="230" height="96" rx="10" fill="#EEF0FF" stroke="#4353D6" stroke-width="1.5"/>
<text x="1015.0" y="386.5" font-size="13" font-weight="700" fill="#2A3690" text-anchor="middle">read findings once</text>
<text x="1015.0" y="402.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">not paged in 4.x</text>
<text x="1015.0" y="418.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">over the cap → run fails</text>
<polyline points="860,398 900,398" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="340" y="480" width="520" height="80" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="600.0" y="516.5" font-size="13" font-weight="700" fill="#0B5E5B" text-anchor="middle">map project → application, merge, close with the mass-close guard</text>
<text x="600.0" y="532.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">asset key per D10: dtrack://&lt;connector&gt;/&lt;project name&gt;, version as asset_version</text>
<polyline points="1015,446 1015,520 860,520" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<rect x="70" y="480" width="230" height="80" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="185.0" y="508.5" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="middle">schedule every 30 min</text>
<text x="185.0" y="524.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">picks up analyses that</text>
<text x="185.0" y="540.5" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">raised no event</text>
<polyline points="300,520 340,520" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
</svg>
