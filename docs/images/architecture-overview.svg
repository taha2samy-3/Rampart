<rect x="0.75" y="0.75" width="1198.5" height="848.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Architecture overview</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">One binary, many targets. The write path and the read path never share a process in production.</text>
<rect x="30" y="84" width="1140" height="742" rx="12" fill="#FFFFFF" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
