<text x="600.0" y="139.0" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Gateway API / Ingress  ·  one hostname, path routing</text>
<text x="600.0" y="156.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">/ingest, /hooks → ingest-gateway   |   /api, /auth, /scim → query-api   |   / → web-ui</text>
