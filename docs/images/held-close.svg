<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img">
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="a-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0E9F9A"/></marker><marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4353D6"/></marker><marker id="a-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker></defs>
<rect x="0.75" y="0.75" width="1198.5" height="598.5" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Held close</text>
<text x="40" y="64" font-size="13" font-weight="400" fill="#475569" text-anchor="start">A run that would close too much is held for a person. A newer run of the same scope makes the hold obsolete.</text>
<rect x="40" y="170" width="220" height="84" rx="10" fill="#E6FAF8" stroke="#0E9F9A" stroke-width="1.5"/>
<text x="150.0" y="201.0" font-size="14" font-weight="700" fill="#0B5E5B" text-anchor="middle">run close step</text>
<text x="150.0" y="217.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">absent &gt; maxClosePercent</text>
<text x="150.0" y="233.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">and &gt; minHeldClose</text>
<rect x="330" y="170" width="200" height="84" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="430.0" y="200.0" font-size="14" font-weight="700" fill="#8A4B04" text-anchor="middle">pending</text>
<text x="430.0" y="217.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">nothing closed yet</text>
<text x="430.0" y="234.0" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">maintainer notified</text>
<polyline points="260,212 330,212" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<text x="295" y="202" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">hold</text>
<rect x="660" y="92" width="240" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
<text x="780.0" y="120.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">discarded</text>
<text x="780.0" y="137.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">nothing changes</text>
<rect x="660" y="180" width="240" height="64" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="780.0" y="208.5" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">confirmed</text>
<text x="780.0" y="225.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">closes what is still absent</text>
<rect x="660" y="268" width="240" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="780.0" y="296.5" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">superseded</text>
<text x="780.0" y="313.5" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">a newer run decided it (D83)</text>
<polyline points="530,192 660,124" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-line)"/>
<text x="585" y="150" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">discard</text>
<polyline points="530,212 660,212" fill="none" stroke="#0E9F9A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-write)"/>
<text x="595" y="204" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">confirm</text>
<polyline points="530,232 660,300" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-line)"/>
<text x="585" y="284" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">newer run</text>
<text x="940" y="196" font-size="12" font-weight="400" fill="#475569" text-anchor="start">A run's close step also supersedes</text>
<text x="940" y="214" font-size="12" font-weight="400" fill="#475569" text-anchor="start">older pending holds of its scope,</text>
<text x="940" y="232" font-size="12" font-weight="400" fill="#475569" text-anchor="start">so the 'held close pending' alert clears.</text>
<rect x="40" y="360" width="1120" height="210" rx="12" fill="#FEF3C7" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="54" y="382" font-size="13" font-weight="700" fill="#8A4B04" text-anchor="start">On confirm, under the scope's advisory lock</text>
<rect x="60" y="404" width="196" height="136" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="158.0" y="453.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">1. newer run?</text>
<text x="158.0" y="469.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">a run of the scope completed</text>
<text x="158.0" y="485.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">after the held run</text>
<text x="158.0" y="501.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">yes → superseded, 409</text>
<polyline points="256,472 278,472" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="278" y="404" width="196" height="136" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="376.0" y="453.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">2. came back?</text>
<text x="376.0" y="469.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">the finding was seen again</text>
<text x="376.0" y="485.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">in a later run</text>
<text x="376.0" y="501.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">yes → kept open</text>
<polyline points="474,472 496,472" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="496" y="404" width="196" height="136" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="594.0" y="453.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">3. mark absent</text>
<text x="594.0" y="469.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">this scope's occurrences</text>
<text x="594.0" y="485.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">become not present</text>
<text x="594.0" y="501.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">(D13 step 1)</text>
<polyline points="692,472 714,472" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="714" y="404" width="196" height="136" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="812.0" y="453.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">4. other source?</text>
<text x="812.0" y="469.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">another scanner still</text>
<text x="812.0" y="485.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">reports the finding</text>
<text x="812.0" y="501.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">yes → kept open (D13)</text>
<polyline points="910,472 932,472" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#a-control)"/>
<rect x="932" y="404" width="196" height="136" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="1030.0" y="453.0" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">5. close</text>
<text x="1030.0" y="469.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">state fixed</text>
<text x="1030.0" y="485.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">closed_by_rescan event</text>
<text x="1030.0" y="501.0" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">audited</text>
</svg>
