<text x="390" y="327" font-size="11" font-weight="500" fill="#475569" text-anchor="end">enqueue debounced sync</text>
<text x="600" y="566" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Project → application mapping: project property · tag · existing asset · purl or repository · parent project · CEL rule · default. Unmapped projects are listed, never dropped.</text>
