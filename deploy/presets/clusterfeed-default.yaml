apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterFeed
metadata:
  name: default
spec:
  egress: allow
  storageMode: lightweight # lightweight (incremental sync) | full (full offline DB mirror like Dependency-Track)
  kev:
    enabled: true
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  epss:
    enabled: true
    url: "https://epss.cyentia.com/epss_scores-current.csv.gz"
  nvd:
    enabled: true
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  osv:
    enabled: true
    url: "https://osv-vulnerabilities.storage.googleapis.com"
  vulnrichment:
    enabled: true
    url: "https://github.com/cisagov/vulnrichment/archive/refs/heads/develop.zip"
  exploitdb:
    enabled: true
    url: "https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv"
