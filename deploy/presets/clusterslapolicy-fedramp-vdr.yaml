apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSLAPolicy
metadata:
  name: fedramp-vdr
spec:
  # FedRAMP Vulnerability Detection and Response (VDR) & VER standard (mandatory from 2026-12-07 per
  # FedRAMP Notice NTC-0014 and CISA BOD 26-04): critical 4d matches PAIN-5 (highest potential agency impact)
  # remediation mandate for Class A & B systems; high 14d matches the Class A evaluation window (VER-TFR-EVU)
  # and CISA KEV timeline; medium 30d and low 90d are accelerated tiers replacing legacy 90d/180d ConMon windows.
  matrix:
    critical: {critical: 4,  high: 4,   medium: 4,  low: 4}
    high:     {critical: 14, high: 14,  medium: 14, low: 14}
    medium:   {critical: 30, high: 30,  medium: 30, low: 30}
    low:      {critical: 90, high: 90,  medium: 90, low: 90}
  caps:
    kevDueDate: true
    maxDays: 90
  startFrom: firstSeen
  restartOnReactivation: true
  pauseDuringRiskAcceptance: true

