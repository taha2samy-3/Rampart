apiVersion: v1
kind: ServiceAccount
metadata:
  name: rampart-operator
  namespace: rampart-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rampart-operator-role
rules:
  - apiGroups:
      - rampart.aspm.dev
    resources:
      - tenants
      - tenants/status
      - applications
      - applications/status
      - scansources
      - scansources/status
      - slapolicies
      - slapolicies/status
      - riskpolicies
      - riskpolicies/status
      - clusterriskpolicies
      - clusterriskpolicies/status
      - clusterslapolicies
      - clusterslapolicies/status
      - clusterfeeds
      - clusterfeeds/status
      - connectors
      - integrationpackages
      - parsers
      - clusterparsers
      - sbomparsers
      - clustersbomparsers
      - sbomanalyzers
      - clustersbomanalyzers
      - externalanalyzers
      - clusterexternalanalyzers
      - externaltrackers
      - clusterexternaltrackers
      - connectors/status
      - integrationpackages/status
      - parsers/status
      - clusterparsers/status
      - sbomparsers/status
      - clustersbomparsers/status
      - sbomanalyzers/status
      - clustersbomanalyzers/status
      - externalanalyzers/status
      - clusterexternalanalyzers/status
      - externaltrackers/status
      - clusterexternaltrackers/status
      - complianceframeworks
      - complianceframeworks/status
      - clustercomplianceframeworks
      - clustercomplianceframeworks/status
      - tenants/finalizers
      - applications/finalizers
      - scansources/finalizers
      - slapolicies/finalizers
      - riskpolicies/finalizers
      - clusterriskpolicies/finalizers
      - clusterslapolicies/finalizers
      - clusterfeeds/finalizers
      - connectors/finalizers
      - integrationpackages/finalizers
      - parsers/finalizers
      - clusterparsers/finalizers
      - sbomparsers/finalizers
      - clustersbomparsers/finalizers
      - sbomanalyzers/finalizers
      - clustersbomanalyzers/finalizers
      - externalanalyzers/finalizers
      - clusterexternalanalyzers/finalizers
      - externaltrackers/finalizers
      - clusterexternaltrackers/finalizers
      - complianceframeworks/finalizers
      - clustercomplianceframeworks/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rampart-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rampart-operator-role
subjects:
  - kind: ServiceAccount
    name: rampart-operator
    namespace: rampart-system

