apiVersion: v1
kind: ServiceAccount
metadata:
  name: rampart-operator
  namespace: rampart-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rampart-operator-role
rules:
  - apiGroups:
      - rampart.aspm.dev
    resources:
      - tenants
      - tenants/status
      - applications
      - applications/status
      - scansources
      - scansources/status
      - slapolicies
      - slapolicies/status
      - riskpolicies
      - riskpolicies/status
      - clusterriskpolicies
      - clusterriskpolicies/status
      - clusterslapolicies
      - clusterslapolicies/status
      - connectors
      - connectors/status
      - tenants/finalizers
      - applications/finalizers
      - scansources/finalizers
      - slapolicies/finalizers
      - riskpolicies/finalizers
      - clusterriskpolicies/finalizers
      - clusterslapolicies/finalizers
      - connectors/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rampart-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rampart-operator-role
subjects:
  - kind: ServiceAccount
    name: rampart-operator
    namespace: rampart-system

