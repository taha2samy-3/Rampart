# The WASM parser modules, delivered to the pod as image volumes (docs/35 B1, docs/34 items 20 and 21 W1).
# Use with:  helm upgrade ... -f deploy/helm/rampart/values-parsers-v1.yaml   (image volumes; for a runtime without them use values-parsers-v1-init.yaml)
#
# Resolved from the public registry on 2026-11-19, tag v1: `crane digest <image>:v1` for the image, and the SHA-256 of /parser.wasm
# read out of that image (`crane export <image>@<digest> - | tar -xO parser.wasm | sha256sum`). The server refuses to start unless each
# module is present with this SHA-256, so a changed image is caught, not loaded. Needs Kubernetes with ImageVolume (the dev cluster is
# v1.35.1). Re-generate when a module is released: the digests below are of v1 as it was on that day.
parsers:
  delivery:
    mode: imageVolume
  modules:
