# -target=all also runs the operator and the scheduler in every replica and there is no leader
# election yet, so keep this at 1 until the targets are split (doc 15).
replicaCount: 1

image:
  repository: ghcr.io/rampart-aspm/rampart
  pullPolicy: IfNotPresent
  tag: "v0.1.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  opsPort: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rampart.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

telemetry:
  logLevel: info
  logFormat: json
  otlpEndpoint: ""

database:
  # Bundled CloudNativePG cluster. Role passwords are generated into Secrets.
  cnpg:
    enabled: true
    instances: 3
    image: ghcr.io/cloudnative-pg/postgresql:16.4
    podMonitor: false
    storage:
      size: 20Gi
  # With cnpg.enabled=false, a Secret with the keys url (rampart_app, pooled), directUrl
  # (rampart_app, direct), migrateUrl (rampart_owner) and systemUrl (rampart_system) (D4).
  # Credentials never go through values.
  existingSecret: ""
  minSchemaVersion: 21

objectStorage:
  endpoint: ""   # used only when seaweedfs.enabled=false (any S3 API)
  # With seaweedfs.enabled=false: a Secret with the keys accessKey and secretKey. Credentials never go through values.
  existingSecret: ""
  # The address clients outside the cluster use to PUT reports (presigned URLs are signed for it).
  # Empty means the in-cluster endpoint, which only works for clients inside the cluster.
  externalEndpoint: ""
  region: "us-east-1"
  bucketRaw: "rampart-raw-reports"
  bucketExports: "rampart-exports"
  usePathStyle: true

# Threat intelligence feeds (docs/16 D35). KEV and EPSS are small; OSV is large, so it is opt-in per ecosystem.
# For an air-gapped cluster, point the URLs at an internal mirror (same file layout as upstream).
feeds:
  enabled: true
  interval: 6h
  kevUrl: ""
  epssUrl: ""
  osvBaseUrl: ""
  osvEcosystems: []   # for example [Go, PyPI, npm, Maven]

# Retention (docs/16 D53): how long each kind of data is kept, in days; 0 keeps it for ever. The server removes
# tenant data every interval as the application role. The partitioned event and audit logs are maintained by the
# CronJob below as the owner role (it also creates the coming months' partitions, so keep it on even with
# retention off). Minimums are enforced: auditDays and eventsDays 365 (PCI DSS 10.5.1), resolvedFindingsDays 180.
retention:
  enabled: true
  interval: 6h
  occurrencesDays: 180
  rawReportsDays: 90
  secretReportsDays: 7
  resolvedFindingsDays: 730
  eventsDays: 730
  auditDays: 2555
  runResultsDays: 30
  maintenance:
    schedule: "17 3 * * *"

seaweedfs:
  enabled: true
  image: chrislusf/seaweedfs:4.53
  persistence:
    size: 50Gi

server:
  # External base URL: builds the OIDC redirect URI and decides Secure cookies (https).
  publicUrl: ""

auth:
  # The first administrator, like Argo CD's initial admin (docs/16 D3, docs/14 section 1). It lets you sign
  # in when no identity provider exists yet. Its password is generated into the Secret <release>-admin.
  bootstrapAdmin:
    enabled: true
    username: admin
    # With single sign-on configured the account switches itself off; true keeps it as break-glass access.
    keepEnabled: false
  oidc:
    # Leave issuer empty to run without browser sign-in (API tokens still work).
    issuer: ""
    clientId: ""
    # A Secret you create holding the client secret. It never goes through values.
    clientSecretName: ""
    clientSecretKey: clientSecret
    # Role on first login when no binding matches: viewer, triager, admin, or "" for no access.
    defaultRole: viewer
    # Roles are granted by bindings, never read straight from the IdP (doc 14 section 3).
    bindings: []
    #  - {kind: group, name: rampart-admins, role: admin}
    #  - {kind: user, name: alice@example.com, role: triager}

operator:
  enabled: true
  mode: auto

# Prometheus (docs/15 section 7). The ops port serves /metrics and is never routed through the ingress.
metrics:
  serviceMonitor:
    enabled: false          # needs the prometheus-operator CRDs
    interval: 30s
    scrapeTimeout: 10s
    namespace: ""           # empty: the release namespace
    labels: {}              # for example {release: kube-prometheus-stack}

# NetworkPolicy (docs/15 section 5, docs/16 D49): the pods of this release get default-deny in both directions,
# then only what they need. Data services (the bundled PostgreSQL cluster and SeaweedFS) are not denied by
# this chart: their own charts and operators own their policies. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # Who may reach the HTTP port: the ingress controller, and anything else that calls the API. The default is
  # every namespace; narrow it, for example
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  ingressFrom:
    - namespaceSelector: {}
  # Who may scrape the ops port.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # Where the operator reaches the Kubernetes API. Empty: any address on port 443 and 6443.
  kubeApiCidrs: []
  # Outbound HTTPS to the internet: feeds (KEV, EPSS, OSV), the identity provider, connectors and
  # Dependency-Track. Turn off in an air-gapped install and list the mirrors in egressExtra.
  allowHttpsEgress: true
  # Where PostgreSQL and the object store are when the chart does not run them (database.cnpg.enabled=false,
  # seaweedfs.enabled=false): a list of NetworkPolicy peers and ports.
  database:
    to: []
    port: 5432
  objectStore:
    to: []
    port: 443
  # Extra egress rules, verbatim NetworkPolicy egress entries.
  egressExtra: []

nodeSelector: {}
tolerations: []
affinity: {}

