apiVersion: v2
name: rampart
description: Rampart Cloud-Native Application Security Posture Management (ASPM) Platform
type: application
version: 0.3.15
appVersion: "0.3.15"
home: https://rampart.aspm.dev
icon: https://raw.githubusercontent.com/taha2samy-3/Rampart/main/web/public/favicon.svg
sources:
  - https://github.com/taha2samy-3/Rampart
keywords:
  - aspm
  - appsec
  - security
  - sbom
  - kubernetes
dependencies:
  # The default scoring policies and compliance frameworks of Rampart (the risk policy, the SLA policy and eleven compliance frameworks),
  # as the default of every tenant: https://github.com/Rampart-Aspm/policies. On by default; policies.enabled: false leaves them out.
  # It is an OCI chart: `helm dependency update` pulls it, so the package ghcr.io/rampart-aspm/charts/rampart-policies must be public.
  - name: rampart-policies
    alias: policies
    version: 0.2.1
    repository: oci://ghcr.io/rampart-aspm/charts
    condition: policies.enabled
  # The default parsers. The server knows no parser by name (D141): each one reaches it as a ClusterParser or ClusterSBOMParser
  # resource, and these two charts are where the defaults live, next to the code of each parser. On by default. The alias
  # is the values key the chart has always used, so parsers.defaultParsers.* and sbomParsers.defaultSBOMParsers.* keep working.
  # Both are OCI charts: `helm dependency update` pulls them, so ghcr.io/rampart-aspm/charts/rampart-parsers and
  # rampart-sbom-parsers must be published (and public).
  - name: rampart-parsers
    alias: parsers
    version: 0.1.0
    repository: oci://ghcr.io/rampart-aspm/charts
    condition: parsers.defaultParsers.enabled
  - name: rampart-sbom-parsers
    alias: sbomParsers
    version: 0.1.0
    repository: oci://ghcr.io/rampart-aspm/charts
    condition: sbomParsers.defaultSBOMParsers.enabled
maintainers:
  - name: rampart-team
    email: security@rampart.aspm.dev
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/taha2samy-3/Rampart
    - name: Issue Tracker
      url: https://github.com/taha2samy-3/Rampart/issues

