{{- if and .Values.feeds.enabled .Values.feeds.defaultMirror.enabled }}
{{- $m := .Values.feeds.defaultMirror }}
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterFeed
metadata:
  name: {{ $m.name | default "default" }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  egress: {{ $m.egress | default "allow" | quote }}
  storageMode: {{ $m.storageMode | default "lightweight" | quote }}
  {{- if and (not .Values.feeds.tokenSecret) (or $m.nvd.tokenFile $m.vulncheckKev.tokenFile) }}
  {{- fail "a feed tokenFile is set but feeds.tokenSecret is empty: the Secret holding the tokens is what is mounted at /etc/rampart/feed-secrets" }}
  {{- end }}
  {{- /* The four built-in feeds run when their block is absent, so a block is written for each: it carries the switch. */}}
  {{- $kevUrl := or $m.kev.url .Values.feeds.kevUrl }}
  kev:
    enabled: {{ ne (toString $m.kev.enabled) "false" }}
    url: {{ required "feeds.defaultMirror.kev.url is required (the kev block needs an address)" $kevUrl | quote }}
  {{- $epssUrl := or $m.epss.url .Values.feeds.epssUrl }}
  epss:
    enabled: {{ ne (toString $m.epss.enabled) "false" }}
    url: {{ required "feeds.defaultMirror.epss.url is required (the epss block needs an address)" $epssUrl | quote }}
  {{- $nvdUrl := or $m.nvd.url .Values.feeds.nvdUrl }}
  nvd:
    enabled: {{ ne (toString $m.nvd.enabled) "false" }}
    {{- with $nvdUrl }}
    url: {{ . | quote }}
    {{- end }}
    {{- with $m.nvd.tokenFile }}
    tokenFile: {{ . | quote }}
    {{- end }}
  {{- $osvUrl := or $m.osv.url .Values.feeds.osvBaseUrl }}
  {{- $osvEcosystems := or $m.osv.ecosystems .Values.feeds.osvEcosystems }}
  osv:
    enabled: {{ ne (toString $m.osv.enabled) "false" }}
    {{- with $osvUrl }}
    url: {{ . | quote }}
    {{- end }}
    {{- with $osvEcosystems }}
    ecosystems:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- /* The optional sources are off when their block is absent, so a switched-off one is simply not written. */}}
  {{- range $name := list "vulnrichment" "exploitdb" "metasploit" "euvd" "vulncheckKev" }}
  {{- $src := index $m $name }}
  {{- if and $src (ne (toString $src.enabled) "false") }}
  {{- if and (eq $name "vulncheckKev") (not $src.tokenFile) }}
  {{- fail "feeds.defaultMirror.vulncheckKev is enabled but has no tokenFile: VulnCheck answers no request without a token. Set tokenFile (under /etc/rampart/feed-secrets) or switch it off." }}
  {{- end }}
  {{ $name }}:
    {{- with $src.url }}
    url: {{ . | quote }}
    {{- end }}
    {{- with $src.tokenFile }}
    tokenFile: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $m.custom }}
  custom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
