{{- /*
The first administrator's password (D3). Generated once and kept across upgrades, like Argo CD's
argocd-initial-admin-secret. Read it with the command in NOTES.txt, sign in, set up single sign-on, and
(optionally) delete this Secret and the account with `rampart admin set-password`.
*/}}
{{- if .Values.auth.bootstrapAdmin.enabled }}
{{- $name := printf "%s-admin" (include "rampart.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
data:
  username: {{ .Values.auth.bootstrapAdmin.username | b64enc }}
  password: {{ if and $existing $existing.data }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
