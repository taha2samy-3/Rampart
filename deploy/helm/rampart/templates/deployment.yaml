apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rampart.fullname" . }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rampart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rampart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rampart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # D1: no Kubernetes API access unless the operator runs in this pod.
      automountServiceAccountToken: {{ .Values.operator.enabled }}
      initContainers:
        - name: wait-for-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "wait", "--min-version={{ .Values.database.minSchemaVersion }}", "--timeout=300s"]
          env:
            {{- include "rampart.dbEnv" (dict "root" . "role" "runtime") | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        {{- if eq (default "none" .Values.parsers.delivery.mode) "initContainer" }}
        {{- /* For a cluster whose runtime has no image volumes (containerd before 2.1): each module image is pulled by digest, its parser.wasm is
        taken out of it and its SHA-256 is checked here, before the server starts (it checks it again against the digest table). */}}
        - name: fetch-wasm-modules
          image: {{ required "parsers.delivery.fetcherImage is required with parsers.delivery.mode=initContainer" .Values.parsers.delivery.fetcherImage | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.parsers.delivery.pullPolicy }}
          command: ["/busybox/sh", "-c"]
          args:
            - |
              set -eu
              fetch() {
                name="$1"; image="$2"; want="$3"
                mkdir -p "/wasm/$name"
                crane export "$image" - | tar -xO parser.wasm > "/wasm/$name/parser.wasm.part"
                got=$(sha256sum "/wasm/$name/parser.wasm.part" | cut -d' ' -f1)
                if [ "$got" != "$want" ]; then
                  echo "module $name: SHA-256 is $got, expected $want" >&2
                  exit 1
                fi
                mv "/wasm/$name/parser.wasm.part" "/wasm/$name/parser.wasm"
                echo "fetched $name"
              }
              {{- range $name, $m := .Values.parsers.modules }}
              fetch {{ $name | quote }} {{ required (printf "parsers.modules.%s.image is required with parsers.delivery.mode=initContainer" $name) $m.image | quote }} {{ required (printf "parsers.modules.%s.sha256 is required with parsers.delivery.mode=initContainer" $name) $m.sha256 | quote }}
              {{- end }}
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: wasm-modules
              mountPath: /wasm
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-target=all"]
          env:
            {{- include "rampart.dbEnv" (dict "root" . "role" "runtime") | nindent 12 }}
            # Migrations run in their own Job (D4), never in the application pod.
            - name: RAMPART_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: RAMPART_OBJECT_STORAGE_ENDPOINT
              value: {{ if .Values.seaweedfs.enabled }}{{ printf "http://%s-objectstore:8333" (include "rampart.fullname" .) | quote }}{{ else }}{{ required "objectStorage.endpoint is required when seaweedfs.enabled=false" .Values.objectStorage.endpoint | quote }}{{ end }}
            {{- with .Values.objectStorage.externalEndpoint }}
            # Presigned upload URLs are signed for this address: what clients outside the cluster can reach.
            - name: RAMPART_OBJECT_STORAGE_EXTERNAL_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: RAMPART_OBJECT_STORAGE_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: RAMPART_OBJECT_STORAGE_USE_PATH_STYLE
              value: {{ .Values.objectStorage.usePathStyle | quote }}
            - name: RAMPART_OBJECT_STORAGE_ACCESS_KEY_FILE
              value: /etc/rampart/secrets/s3-access-key
            - name: RAMPART_OBJECT_STORAGE_SECRET_KEY_FILE
              value: /etc/rampart/secrets/s3-secret-key
            - name: RAMPART_OBJECT_STORAGE_BUCKET_RAW
              value: {{ .Values.objectStorage.bucketRaw | quote }}
            {{- include "rampart.retentionEnv" . | nindent 12 }}
            # Analyzers on SBOMs: on upload, on request and on a schedule (docs/16 D143).
            - name: RAMPART_ANALYSIS_ENABLED
              value: {{ .Values.analysis.enabled | quote }}
            - name: RAMPART_ANALYSIS_MAX_AGE
              value: {{ .Values.analysis.maxAge | quote }}
            - name: RAMPART_ANALYSIS_MAX_IN_FLIGHT
              value: {{ .Values.analysis.maxInFlight | quote }}
            # Threat intelligence (KEV, EPSS, optionally OSV). Needs egress, or a mirror set in the URLs below.
            - name: RAMPART_FEEDS_ENABLED
              value: {{ .Values.feeds.enabled | quote }}
            - name: RAMPART_FEEDS_INTERVAL
              value: {{ .Values.feeds.interval | quote }}
            {{- with .Values.feeds.kevUrl }}
            - name: RAMPART_FEEDS_KEV_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.feeds.epssUrl }}
            - name: RAMPART_FEEDS_EPSS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.feeds.osvBaseUrl }}
            - name: RAMPART_FEEDS_OSV_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.feeds.osvEcosystems }}
            - name: RAMPART_FEEDS_OSV_ECOSYSTEMS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if or (eq (default "none" .Values.parsers.delivery.mode) "imageVolume") (eq (default "none" .Values.parsers.delivery.mode) "initContainer") }}
            # The shipped parser modules, checked against a digest table at start-up (docs/35 B1).
            - name: RAMPART_WASM_DIR
              value: {{ .Values.parsers.delivery.mountPath | quote }}
            - name: RAMPART_WASM_DIGESTS
              value: /etc/rampart/wasm/digests.json
            {{- end }}
            - name: RAMPART_LOG_LEVEL
              value: {{ .Values.telemetry.logLevel | quote }}
            - name: RAMPART_LOG_FORMAT
              value: {{ .Values.telemetry.logFormat | quote }}
            {{- with .Values.telemetry.otlpEndpoint }}
            - name: RAMPART_TELEMETRY_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: RAMPART_OPERATOR_MODE
              value: {{ .Values.operator.mode | quote }}
            # The operator's own identity (D1): the Lease namespace and the per-tenant secret-reader binding.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: RAMPART_OPERATOR_SERVICE_ACCOUNT
              value: {{ include "rampart.serviceAccountName" . | quote }}
            - name: RAMPART_OPERATOR_SECRET_READER_CLUSTER_ROLE
              value: {{ printf "%s-tenant-secret-reader" (include "rampart.fullname" .) | quote }}
            # Browser sign-in (doc 14). The session key is generated once into a Secret and mounted as a file.
            - name: RAMPART_SERVER_PUBLIC_URL
              value: {{ .Values.server.publicUrl | quote }}
            - name: RAMPART_AUTH_SESSION_KEY_FILE
              value: /etc/rampart/secrets/session.key
            {{- if .Values.auth.bootstrapAdmin.enabled }}
            # The first administrator (D3), like Argo CD's initial admin: created once at first start from a
            # generated Secret. With single sign-on configured it switches itself off unless keepEnabled.
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.bootstrapAdmin.username | quote }}
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE
              value: /etc/rampart/secrets/admin-password
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_KEEP_ENABLED
              value: {{ .Values.auth.bootstrapAdmin.keepEnabled | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.issuer }}
            - name: RAMPART_AUTH_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: RAMPART_AUTH_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required with auth.oidc.issuer" .Values.auth.oidc.clientId | quote }}
            - name: RAMPART_AUTH_OIDC_CLIENT_SECRET_FILE
              value: /etc/rampart/secrets/oidc-client-secret
            - name: RAMPART_AUTH_OIDC_DEFAULT_ROLE
              value: {{ .Values.auth.oidc.defaultRole | quote }}
            {{- with .Values.auth.oidc.bindings }}
            - name: RAMPART_AUTH_OIDC_BINDINGS
              value: {{ range $i, $b := . }}{{ if $i }},{{ end }}{{ $b.kind }}:{{ $b.name }}={{ $b.role }}{{ end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          # doc 15 / D6: /healthz is liveness (no dependency checks), /readyz is readiness.
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/rampart/secrets
              readOnly: true
            {{- if .Values.feeds.plugins }}
            - name: feed-push-tokens
              mountPath: /var/run/rampart/feeds
              readOnly: true
            {{- end }}
            {{- if .Values.feeds.tokenSecret }}
            - name: feed-secrets
              mountPath: /etc/rampart/feed-secrets
              readOnly: true
            {{- end }}
            {{- if or (eq (default "none" .Values.parsers.delivery.mode) "imageVolume") (eq (default "none" .Values.parsers.delivery.mode) "initContainer") }}
            - name: wasm-digests
              mountPath: /etc/rampart/wasm
              readOnly: true
            {{- end }}
            {{- if eq (default "none" .Values.parsers.delivery.mode) "initContainer" }}
            - name: wasm-modules
              mountPath: {{ .Values.parsers.delivery.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if eq (default "none" .Values.parsers.delivery.mode) "imageVolume" }}
            {{- range $name, $m := .Values.parsers.modules }}
            - name: {{ printf "wasm-%s" $name | trunc 63 | trimSuffix "-" }}
              mountPath: {{ printf "%s/%s" $.Values.parsers.delivery.mountPath $name }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if or (eq (default "none" .Values.parsers.delivery.mode) "imageVolume") (eq (default "none" .Values.parsers.delivery.mode) "initContainer") }}
        - name: wasm-digests
          configMap:
            name: {{ include "rampart.fullname" . }}-wasm-digests
        {{- end }}
        {{- if eq (default "none" .Values.parsers.delivery.mode) "initContainer" }}
        - name: wasm-modules
          emptyDir: {}
        {{- end }}
        {{- if eq (default "none" .Values.parsers.delivery.mode) "imageVolume" }}
        {{- range $name, $m := .Values.parsers.modules }}
        - name: {{ printf "wasm-%s" $name | trunc 63 | trimSuffix "-" }}
          image:
            reference: {{ required (printf "parsers.modules.%s.image is required with parsers.delivery.mode=imageVolume" $name) $m.image | quote }}
            pullPolicy: {{ default "IfNotPresent" $.Values.parsers.delivery.pullPolicy }}
        {{- end }}
        {{- end }}
        {{- if .Values.feeds.tokenSecret }}
        - name: feed-secrets
          secret:
            secretName: {{ .Values.feeds.tokenSecret | quote }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.feeds.plugins }}
        - name: feed-push-tokens
          projected:
            sources:
              {{- range .Values.feeds.plugins }}
              - secret:
                  name: {{ .tokenSecret }}
                  items: [{key: token, path: {{ .name }}/token}]
              {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "rampart.fullname" . }}-session
                  items: [{key: session.key, path: session.key}]
              - secret:
                  name: {{ if .Values.seaweedfs.enabled }}{{ include "rampart.fullname" . }}-objectstore{{ else }}{{ required "objectStorage.existingSecret (keys accessKey, secretKey) is required when seaweedfs.enabled=false" .Values.objectStorage.existingSecret }}{{ end }}
                  items:
                    - {key: accessKey, path: s3-access-key}
                    - {key: secretKey, path: s3-secret-key}
              {{- if .Values.auth.bootstrapAdmin.enabled }}
              - secret:
                  name: {{ include "rampart.fullname" . }}-admin
                  items: [{key: password, path: admin-password}]
              {{- end }}
              {{- if .Values.auth.oidc.issuer }}
              - secret:
                  name: {{ required "auth.oidc.clientSecretName is required with auth.oidc.issuer" .Values.auth.oidc.clientSecretName }}
                  items: [{key: {{ .Values.auth.oidc.clientSecretKey }}, path: oidc-client-secret}]
              {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

