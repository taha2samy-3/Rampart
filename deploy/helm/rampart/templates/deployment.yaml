apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rampart.fullname" . }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rampart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rampart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rampart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # D1: no Kubernetes API access unless the operator runs in this pod.
      automountServiceAccountToken: {{ .Values.operator.enabled }}
      initContainers:
        - name: wait-for-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "wait", "--min-version={{ .Values.database.minSchemaVersion }}", "--timeout=300s"]
          env:
            {{- include "rampart.dbEnv" (dict "root" . "role" "runtime") | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-target=all"]
          env:
            {{- include "rampart.dbEnv" (dict "root" . "role" "runtime") | nindent 12 }}
            # Migrations run in their own Job (D4), never in the application pod.
            - name: RAMPART_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: RAMPART_OBJECT_STORAGE_ENDPOINT
              value: {{ if .Values.seaweedfs.enabled }}{{ printf "http://%s-objectstore:8333" (include "rampart.fullname" .) | quote }}{{ else }}{{ required "objectStorage.endpoint is required when seaweedfs.enabled=false" .Values.objectStorage.endpoint | quote }}{{ end }}
            - name: RAMPART_OBJECT_STORAGE_BUCKET_RAW
              value: {{ .Values.objectStorage.bucketRaw | quote }}
            - name: RAMPART_LOG_LEVEL
              value: {{ .Values.telemetry.logLevel | quote }}
            - name: RAMPART_LOG_FORMAT
              value: {{ .Values.telemetry.logFormat | quote }}
            - name: RAMPART_OPERATOR_MODE
              value: {{ .Values.operator.mode | quote }}
            # The operator's own identity (D1): the Lease namespace and the per-tenant secret-reader binding.
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: RAMPART_OPERATOR_SERVICE_ACCOUNT
              value: {{ include "rampart.serviceAccountName" . | quote }}
            - name: RAMPART_OPERATOR_SECRET_READER_CLUSTER_ROLE
              value: {{ printf "%s-tenant-secret-reader" (include "rampart.fullname" .) | quote }}
            # Browser sign-in (doc 14). The session key is generated once into a Secret and mounted as a file.
            - name: RAMPART_SERVER_PUBLIC_URL
              value: {{ .Values.server.publicUrl | quote }}
            - name: RAMPART_AUTH_SESSION_KEY_FILE
              value: /etc/rampart/secrets/session.key
            {{- if .Values.auth.bootstrapAdmin.enabled }}
            # The first administrator (D3), like Argo CD's initial admin: created once at first start from a
            # generated Secret. With single sign-on configured it switches itself off unless keepEnabled.
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.bootstrapAdmin.username | quote }}
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE
              value: /etc/rampart/secrets/admin-password
            - name: RAMPART_AUTH_BOOTSTRAP_ADMIN_KEEP_ENABLED
              value: {{ .Values.auth.bootstrapAdmin.keepEnabled | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.issuer }}
            - name: RAMPART_AUTH_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: RAMPART_AUTH_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required with auth.oidc.issuer" .Values.auth.oidc.clientId | quote }}
            - name: RAMPART_AUTH_OIDC_CLIENT_SECRET_FILE
              value: /etc/rampart/secrets/oidc-client-secret
            - name: RAMPART_AUTH_OIDC_DEFAULT_ROLE
              value: {{ .Values.auth.oidc.defaultRole | quote }}
            {{- with .Values.auth.oidc.bindings }}
            - name: RAMPART_AUTH_OIDC_BINDINGS
              value: {{ range $i, $b := . }}{{ if $i }},{{ end }}{{ $b.kind }}:{{ $b.name }}={{ $b.role }}{{ end }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          # doc 15 / D6: /healthz is liveness (no dependency checks), /readyz is readiness.
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/rampart/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "rampart.fullname" . }}-session
                  items: [{key: session.key, path: session.key}]
              {{- if .Values.auth.bootstrapAdmin.enabled }}
              - secret:
                  name: {{ include "rampart.fullname" . }}-admin
                  items: [{key: password, path: admin-password}]
              {{- end }}
              {{- if .Values.auth.oidc.issuer }}
              - secret:
                  name: {{ required "auth.oidc.clientSecretName is required with auth.oidc.issuer" .Values.auth.oidc.clientSecretName }}
                  items: [{key: {{ .Values.auth.oidc.clientSecretKey }}, path: oidc-client-secret}]
              {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

