{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rampart.serviceAccountName" . }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
D1: only the operator talks to the Kubernetes API. Secrets are never readable cluster-wide:
the operator creates a Role per tenant namespace and may bind only the reader ClusterRole below.
*/}}
{{- if .Values.operator.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rampart.fullname" . }}-tenant-secret-reader
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rampart.fullname" . }}-operator
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
rules:
  - apiGroups: [rampart.aspm.dev]
    resources: [tenants, applications, scansources, slapolicies]
    verbs: [get, list, watch]
  - apiGroups: [rampart.aspm.dev]
    resources: [tenants/status, applications/status, scansources/status, slapolicies/status, tenants/finalizers, scansources/finalizers]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # The operator may grant only the secret-reader role, and only inside tenant namespaces.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [{{ include "rampart.fullname" . }}-tenant-secret-reader]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [get]
    resourceNames: [{{ include "rampart.fullname" . }}-tenant-secret-reader]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rampart.fullname" . }}-operator
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rampart.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "rampart.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
