{{- /*
D4: on install this is a plain Job (not a hook) so it can wait for the bundled CNPG
cluster created by the same release; on upgrade it is a pre-upgrade hook (expand step).
The name carries the revision so the install Job never collides with an upgrade hook.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rampart.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if not .Release.IsInstall }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  {{- end }}
spec:
  # The database may still be starting (bundled CNPG): keep retrying.
  backoffLimit: 30
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "rampart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          env:
            {{- include "rampart.dbEnv" (dict "root" . "role" "migrate") | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
