{{- /*
ClusterParser custom resources deployed by default in Rampart (docs/29).
Each parser can be toggled on/off individually in values.yaml under parsers.defaultParsers.<name>.enabled
*/}}

{{- if and .Values.parsers (hasKey .Values.parsers "defaultParsers") .Values.parsers.defaultParsers.enabled (index .Values.parsers.defaultParsers "sarif").enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterParser
metadata:
  name: sarif
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  category: sast
  runtime: wasm
  source:
    oci: ghcr.io/rampart-aspm/parsers/sarif:v1
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
  description: Streaming SARIF 2.1.0 parser with Semgrep, Trivy, Gitleaks enrichers
  detect:
    filenames:
    - '*.sarif'
    - '*sarif*.json'
    probes:
    - jsonHasKeys:
      - runs
{{- end }}

