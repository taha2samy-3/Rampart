{{- if .Values.database.cnpg.enabled }}
{{- /* Role passwords are generated once and kept across upgrades (lookup). They are never in values. */}}
{{- range $role := list "app" "system" }}
{{- $name := printf "%s-db-%s" (include "rampart.fullname" $) $role }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ $name }}
  labels:
    {{- include "rampart.labels" $ | nindent 4 }}
    cnpg.io/reload: "true"
data:
  username: {{ printf "rampart_%s" $role | b64enc }}
  password: {{ if and $existing $existing.data }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
{{- end }}
{{- end }}
