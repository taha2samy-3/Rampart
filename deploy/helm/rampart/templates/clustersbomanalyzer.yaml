{{- if and .Values.sbomAnalyzer .Values.sbomAnalyzer.enabled }}
{{- /* A value that is false must stay false: `default` would turn it into its default, so each key is looked up by name. */}}
{{- $rules := .Values.sbomAnalyzer.rules | default dict }}
{{- $sources := .Values.sbomAnalyzer.sources | default dict }}
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMAnalyzer
metadata:
  name: native-matcher
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  enabled: true
  engine: {{ .Values.sbomAnalyzer.engine | default "hybrid" | quote }}
  description: "Native in-process SBOM vulnerability matcher (OSV, GHSA, Advisory-DB)"
  rules:
    minConfidence: {{ ternary $rules.minConfidence 0.8 (hasKey $rules "minConfidence") }}
    includePreRelease: {{ ternary $rules.includePreRelease false (hasKey $rules "includePreRelease") }}
    matchDirectOnly: {{ ternary $rules.matchDirectOnly false (hasKey $rules "matchDirectOnly") }}
  sources:
    osv: {{ ternary $sources.osv true (hasKey $sources "osv") }}
    ghsa: {{ ternary $sources.ghsa true (hasKey $sources "ghsa") }}
    nvd: {{ ternary $sources.nvd false (hasKey $sources "nvd") }}
{{- end }}
