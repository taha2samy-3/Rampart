{{- /* 32-byte key that signs CSRF tokens and seals the login state (D6 auth.session.keyFile). Generated once and kept across upgrades. */}}
{{- $name := printf "%s-session" (include "rampart.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
data:
  session.key: {{ if and $existing $existing.data }}{{ index $existing.data "session.key" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
