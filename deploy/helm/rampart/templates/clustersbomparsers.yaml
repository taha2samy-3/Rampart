{{- if and .Values.sbomParsers (hasKey .Values.sbomParsers "defaultSBOMParsers") .Values.sbomParsers.defaultSBOMParsers.enabled (index .Values.sbomParsers.defaultSBOMParsers "cyclonedx").enabled }}
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMParser
metadata:
  name: sbom-cyclonedx
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  format: cyclonedx
  runtime: wasm
  source:
    oci: ghcr.io/rampart-aspm/sbom-parsers/sbom-cyclonedx:v1
  description: CycloneDX 1.4-1.6 streaming WASM SBOM parser
  detect:
    filenames:
    - '*cyclonedx*'
    - '*.cdx.json'
    - '*.cdx.xml'
    contentTypes:
    - '*cyclonedx*'
    probes:
    - jsonHasKeys:
      - bomFormat
    - contains:
      - '<bom'
      - 'cyclonedx.org'
  options:
    buildDependencyGraph: true
    extractVulnerabilities: {{ default false (index .Values.sbomParsers.defaultSBOMParsers "cyclonedx").extractVulnerabilities }}
{{- end }}

{{- if and .Values.sbomParsers (hasKey .Values.sbomParsers "defaultSBOMParsers") .Values.sbomParsers.defaultSBOMParsers.enabled (index .Values.sbomParsers.defaultSBOMParsers "spdx").enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMParser
metadata:
  name: sbom-spdx
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  format: spdx
  runtime: wasm
  source:
    oci: ghcr.io/rampart-aspm/sbom-parsers/sbom-spdx:v1
  description: SPDX 2.2, 2.3 and 3.0 streaming WASM SBOM parser for JSON, JSON-LD, and Tag-Value
  detect:
    filenames:
    - '*spdx*'
    - '*.spdx.json'
    - '*.spdx'
    - '*.spdx.jsonld'
    contentTypes:
    - '*spdx*'
    probes:
    - jsonHasKeys:
      - spdxVersion
    - contains:
      - 'SPDXVersion:'
  options:
    buildDependencyGraph: true
{{- end }}

{{- if and .Values.sbomParsers (hasKey .Values.sbomParsers "defaultSBOMParsers") .Values.sbomParsers.defaultSBOMParsers.enabled (index .Values.sbomParsers.defaultSBOMParsers "syft").enabled }}
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMParser
metadata:
  name: sbom-syft
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
spec:
  format: syft
  runtime: wasm
  source:
    oci: ghcr.io/rampart-aspm/sbom-parsers/sbom-syft:v1
  description: Anchore Syft JSON streaming WASM SBOM reader (packages, licences and relationships)
  detect:
    filenames:
    - '*syft*.json'
    - '*.syft.json'
    contentTypes:
    - '*syft+json*'
    reject:
    - '"bomFormat"'
    - '"spdxVersion"'
    rules:
    - allOf:
      - '"artifacts"'
      - '"foundBy"'
      weight: 60
    - allOf:
      - '"artifacts"'
      - '"artifactRelationships"'
      weight: 60
    - anyOf:
      - '"syft"'
      weight: 30
  options:
    buildDependencyGraph: true
{{- end }}
