{{- /*
docs/16 D4, D53: the event and audit logs are partitioned by month. This CronJob, as rampart_owner (the only role
that may create or drop a partition, and the audit log is append-only for every other role, D46), creates the
coming months and drops the months past retention. The server does not hold the owner's credentials.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rampart.fullname" . }}-maintenance
  labels:
    {{- include "rampart.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  schedule: {{ .Values.retention.maintenance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "rampart.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: maintenance
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["maintenance"]
              env:
                {{- include "rampart.dbEnv" (dict "root" . "role" "migrate") | nindent 16 }}
                {{- include "rampart.retentionEnv" . | nindent 16 }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
