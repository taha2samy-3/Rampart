apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersbomanalyzers.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ClusterSBOMAnalyzer
    listKind: ClusterSBOMAnalyzerList
    plural: clustersbomanalyzers
    singular: clustersbomanalyzer
    shortNames:
      - clsbomanalyzer
      - csbomanalyzer
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Enabled, type: boolean, jsonPath: .spec.enabled}
        - {name: Engine, type: string, jsonPath: .spec.engine}
        - {name: MinConfidence, type: number, jsonPath: .spec.rules.minConfidence}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status"}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: ClusterSBOMAnalyzer configures the native in-process SBOM vulnerability matcher.
              properties:
                enabled:
                  type: boolean
                  default: true
                  description: Controls whether native SBOM analysis/matching is activated.
                engine:
                  type: string
                  enum: [hybrid, osv, in-process, advisory-db]
                  default: hybrid
                  description: Matching engine implementation.
                description:
                  type: string
                rules:
                  type: object
                  description: Matching thresholds and rule filters.
                  properties:
                    minConfidence:
                      type: number
                      default: 0.8
                    includePreRelease:
                      type: boolean
                      default: false
                    matchDirectOnly:
                      type: boolean
                      default: false
                sources:
                  type: object
                  description: Vulnerability feed sources to query.
                  properties:
                    osv:
                      type: boolean
                      default: true
                    ghsa:
                      type: boolean
                      default: true
                    nvd:
                      type: boolean
                      default: false
                schedule:
                  type: string
                  description: Optional cron expression for background re-analysis of existing SBOMs.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
