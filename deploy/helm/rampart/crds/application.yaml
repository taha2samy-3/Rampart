apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
    shortNames:
      - rapp   # D20: avoids confusion with Argo CD's Application
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                displayName:
                  type: string
                businessCriticality:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - critical
                internetFacing:
                  type: boolean
                owners:
                  type: array
                  items:
                    type: string
                dataClassification:
                  type: array
                  items:
                    type: string
                    enum: [pii, pci, phi, secret, public]
                compensatingControls:
                  description: Controls in front of the application. waf and apiGateway lower the score of findings from dynamic scans (docs/16 D55).
                  type: array
                  items:
                    type: string
                    enum: [waf, apiGateway, mtls, privateNetwork]
                type:
                  type: string
                  enum: [repo]
                  description: >-
                    What kind of thing the application is. repo is one branch of one repository and needs repository and branch.
                    machine is designed and not built yet, so it is refused. Left out, the application is repository-wide, as before.
                repository:
                  type: string
                  maxLength: 2048
                  description: 'The repository address of a repo application: one repository, no pattern. Needs type repo.'
                branch:
                  type: string
                  maxLength: 255
                  pattern: '^[^\s*]+$'
                  description: 'The branch of a repo application: one branch, no pattern, because an application is one branch. Needs type repo.'
                environment:
                  type: string
                  enum: [production, staging, test, development]
                  description: 'Where the application runs. Left out, the application is not described, and the score gives it no environment points.'
                complianceScope:
                  description: >-
                    The compliance scopes the application is in, for example pci or sox. A ComplianceFramework with
                    appliesTo.complianceScope reads only the applications that list the scope (docs/16 D102).
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9:._-]{0,63}$'
                selectors:
                  description: Attach repositories and images to this application automatically. A pattern is an exact key or a prefix ending in * (docs/16 D56).
                  type: object
                  properties:
                    repositories:
                      type: array
                      items:
                        type: object
                        required: [url]
                        properties:
                          url:
                            type: string
                            minLength: 1
                    images:
                      type: array
                      items:
                        type: object
                        required: [repository]
                        properties:
                          repository:
                            type: string
                            minLength: 1
                    workloads:
                      description: Not built yet (needs a connected cluster); a resource that sets it is refused with the reason.
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
              required:
                - displayName
            status:
              type: object
              properties:
                applicationId:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}

