apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: integrationpackages.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: IntegrationPackage
    listKind: IntegrationPackageList
    plural: integrationpackages
    singular: integrationpackage
    shortNames:
      - rppkg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Kind, type: string, jsonPath: .spec.kind}
        - {name: Version, type: string, jsonPath: .spec.version}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status"}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                A tool described as data (docs/19 §6, docs/16 D94): its secrets, the hosts it may reach and the request it
                makes. A tenant namespace accepts only data runtimes; the operator validates the definition and refuses what
                this version does not run, by name.
              required: [kind, runtime, version, egress]
              properties:
                kind:
                  type: string
                  enum: [notifier, tracker, source, parser]
                runtime:
                  type: string
                  enum: [declarative, mapping, wasm, grpc]
                version:
                  type: string
                description:
                  type: string
                configSchema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                secrets:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                egress:
                  type: array
                  items:
                    type: string
                send:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}
