apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterfeedmirrors.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ClusterFeedMirror
    listKind: ClusterFeedMirrorList
    plural: clusterfeedmirrors
    singular: clusterfeedmirror
    shortNames:
      - cfm
      - feed
      - feeds
      - clusterfeed
      - clusterfeeds
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                Where the vulnerability-intelligence feeds are read from (docs/04, docs/16 D86). The one named default is in
                force, else the first by name. With egress deny, a feed without a mirror is not read at all (air-gapped
                installs). A per-feed schedule and the cwe feed are not built and are refused with the reason.
              properties:
                nvd:
                  type: object
                  required: [url]
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    schedule: {type: string, description: "Not built; refused. Every feed runs every feeds.interval."}
                osv:
                  type: object
                  required: [url]
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    schedule: {type: string, description: "Not built; refused."}
                epss:
                  type: object
                  required: [url]
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    schedule: {type: string, description: "Not built; refused."}
                kev:
                  type: object
                  required: [url]
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    schedule: {type: string, description: "Not built; refused."}
                cwe:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Not built; refused.
                vulnrichment: &src
                  type: object
                  description: "D88. Optional source; the block switches it on. url replaces the public address; tokenFile is a mounted Secret."
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    tokenFile: {type: string, pattern: '^/'}
                exploitdb: *src
                metasploit: *src
                euvd: *src
                vulncheckKev:
                  type: object
                  required: [tokenFile]
                  description: "D88. VulnCheck KEV; a token is required (community or commercial)."
                  properties:
                    url: {type: string, pattern: '^https?://'}
                    tokenFile: {type: string, pattern: '^/'}
                custom:
                  type: array
                  description: "D88. Licensed or in-house intelligence in a documented format (osv-zip or intel-jsonl)."
                  items:
                    type: object
                    required: [name, url, format]
                    properties:
                      name: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,40}$'}
                      url: {type: string, pattern: '^https?://'}
                      format: {type: string, enum: [osv-zip, intel-jsonl]}
                      tokenFile: {type: string, pattern: '^/'}
                egress:
                  type: string
                  enum: [allow, deny]
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}
