apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: connectors.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: Connector
    listKind: ConnectorList
    plural: connectors
    singular: connector
    shortNames:
      - rpconn
      - conn
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Connector configuration for outbound trackers, notifiers and sources (docs/04, docs/16 D69).
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - jira
                    - github
                    - slack
                    - teams
                    - email
                    - webhook
                    - dependencyTrack
                direction:
                  type: string
                  enum:
                    - outbound
                    - inbound
                    - bidirectional
                jira:
                  type: object
                  properties:
                    url:
                      type: string
                    credentialsSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    defaultProject:
                      type: string
                    issueType:
                      type: string
                    severityToPriority:
                      type: object
                      additionalProperties:
                        type: string
                    statusMapping:
                      type: object
                      properties:
                        closedStatuses:
                          type: array
                          items:
                            type: string
                        resolutionToState:
                          type: object
                          additionalProperties:
                            type: string
                    twoWaySync:
                      type: boolean
                    syncInterval:
                      type: string
                    customFields:
                      type: object
                      additionalProperties:
                        type: string
                github:
                  type: object
                  properties:
                    owner:
                      type: string
                    repo:
                      type: string
                    credentialsSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    severityToLabels:
                      type: object
                      additionalProperties:
                        type: string
                    defaultLabels:
                      type: array
                      items:
                        type: string
                    twoWaySync:
                      type: boolean
                slack:
                  type: object
                  properties:
                    tokenSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    defaultChannel:
                      type: string
                teams:
                  type: object
                  properties:
                    webhookSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                email:
                  type: object
                  properties:
                    smtp:
                      type: object
                      properties:
                        host:
                          type: string
                        port:
                          type: integer
                        credentialsSecretRef:
                          type: object
                          properties:
                            name:
                              type: string
                            key:
                              type: string
                        tls:
                          type: boolean
                    from:
                      type: string
                    to:
                      type: array
                      items:
                        type: string
                webhook:
                  type: object
                  properties:
                    url:
                      type: string
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    format:
                      type: string
                      enum: [cloudevents, raw]
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                dependencyTrack:
                  type: object
                  properties:
                    url:
                      type: string
                    credentialsSecretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                webhookURL:
                  type: string
                lastSync:
                  type: string
                  format: date-time
