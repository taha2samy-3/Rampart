apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusteridentityproviders.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ClusterIdentityProvider
    listKind: ClusterIdentityProviderList
    plural: clusteridentityproviders
    singular: clusteridentityprovider
    shortNames:
      - cridp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                Platform-wide OIDC or SAML configuration shared across tenants (docs/04, docs/14 section 7).
              required:
                - type
              properties:
                displayName:
                  type: string
                type:
                  type: string
                  enum: [oidc, saml]
                allowedTenants:
                  type: array
                  items:
                    type: string
                  description: 'List of tenant slugs allowed to use this provider; empty allows all tenants.'
                oidc:
                  type: object
                  properties:
                    issuer:
                      type: string
                    clientId:
                      type: string
                    clientSecretRef:
                      type: object
                      required: [name, key]
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    scopes:
                      type: array
                      items:
                        type: string
                    claims:
                      type: object
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        groups:
                          type: string
                    requireEmailVerified:
                      type: boolean
                    pkce:
                      type: string
                    acrValues:
                      type: array
                      items:
                        type: string
                    backchannelLogout:
                      type: boolean
                saml:
                  type: object
                  properties:
                    metadataURL:
                      type: string
                    metadataXML:
                      type: string
                    entityID:
                      type: string
                    nameIDFormat:
                      type: string
                    attributes:
                      type: object
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        groups:
                          type: string
                    allowIdPInitiated:
                      type: boolean
                    spKeyPairRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                login:
                  type: object
                  properties:
                    emailDomains:
                      type: array
                      items:
                        type: string
                    allowedDomains:
                      type: array
                      items:
                        type: string
                    requireGroup:
                      type: string
                provisioning:
                  type: object
                  properties:
                    jit:
                      type: boolean
                    groupFilter:
                      type: string
                    stripGroupPrefix:
                      type: string
                session:
                  type: object
                  properties:
                    idleTimeout:
                      type: string
                    absoluteTimeout:
                      type: string
                    revalidateInterval:
                      type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                redirectURI:
                  type: string
                jwksLastFetched:
                  type: string
                  format: date-time
                logins24h:
                  type: integer
      subresources:
        status: {}

