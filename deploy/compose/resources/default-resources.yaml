apiVersion: rampart.aspm.dev/v1alpha1
kind: Tenant
metadata:
  name: default
spec:
  displayName: Default Organization
  namespaces: [default]   # D20: the binding comes only from this list
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: Application
metadata:
  name: payments-api
  namespace: default
spec:
  displayName: Payments Processing Service
  businessCriticality: critical
  internetFacing: true
  owners:
    - payments-team@company.internal
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ScanSource
metadata:
  name: ci-semgrep
  namespace: default
spec:
  scannerFamily: semgrep
  type: reportUpload
---
apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterFeed
metadata:
  name: default
spec:
  egress: allow
  kev:
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  epss:
    url: "https://epss.cyentia.com/epss_scores-current.csv.gz"
  nvd:
    url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  osv:
    url: "https://osv-vulnerabilities.storage.googleapis.com"


