services:
  postgres:
    image: postgres:16-alpine
    container_name: rampart-postgres
    environment:
      POSTGRES_USER: rampart_owner
      POSTGRES_PASSWORD: rampart_password
      POSTGRES_DB: rampart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rampart_owner -d rampart"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rampart-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  rampart:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    container_name: rampart-all
    command: ["/app/rampart", "-target=all"]
    environment:
      RAMPART_DATABASE_URL: "postgres://rampart_owner:rampart_password@postgres:5432/rampart?sslmode=disable"
      RAMPART_DATABASE_DIRECT_URL: "postgres://rampart_owner:rampart_password@postgres:5432/rampart?sslmode=disable"
      RAMPART_OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
      RAMPART_OBJECT_STORAGE_BUCKET_RAW: "rampart-raw-reports"
      RAMPART_SERVER_HTTP_ADDR: ":8080"
      RAMPART_SERVER_OPS_ADDR: ":9090"
      RAMPART_LOG_LEVEL: "info"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./resources:/etc/rampart/resources:ro

volumes:
  pgdata:
  miniodata:

