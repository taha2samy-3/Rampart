services:
  postgres:
    image: postgres:16-alpine
    container_name: rampart-postgres
    environment:
      POSTGRES_USER: rampart_owner
      POSTGRES_PASSWORD: ${RAMPART_OWNER_PASSWORD:?set RAMPART_OWNER_PASSWORD in .env}
      POSTGRES_DB: rampart
      RAMPART_APP_PASSWORD: ${RAMPART_APP_PASSWORD:?set RAMPART_APP_PASSWORD in .env}
      RAMPART_SYSTEM_PASSWORD: ${RAMPART_SYSTEM_PASSWORD:?set RAMPART_SYSTEM_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rampart_owner -d rampart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store: SeaweedFS (Apache-2.0). Any S3 API works in its place.
  objectstore:
    image: chrislusf/seaweedfs:4.53
    container_name: rampart-objectstore
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Development identity provider with two demo users (see dex/config.yaml.tpl; ./init.sh renders it). Not for production.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: rampart-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      RAMPART_OIDC_CLIENT_SECRET: ${RAMPART_OIDC_CLIENT_SECRET:?set RAMPART_OIDC_CLIENT_SECRET in .env}
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    # rampart shares this network namespace (see below), so the app publishes its ports here.
    ports:
      - "127.0.0.1:5556:5556"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"

  rampart:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    container_name: rampart-all
    command: ["/app/rampart", "-target=all"]
    environment:
      # D4: the app runs as rampart_app (RLS enforced); migrations as rampart_owner; tenant bootstrap as rampart_system.
      RAMPART_DATABASE_URL: "postgres://rampart_app:${RAMPART_APP_PASSWORD}@postgres:5432/rampart?sslmode=disable"
      RAMPART_DATABASE_DIRECT_URL: "postgres://rampart_app:${RAMPART_APP_PASSWORD}@postgres:5432/rampart?sslmode=disable"
      RAMPART_DATABASE_MIGRATE_URL: "postgres://rampart_owner:${RAMPART_OWNER_PASSWORD}@postgres:5432/rampart?sslmode=disable"
      RAMPART_DATABASE_SYSTEM_URL: "postgres://rampart_system:${RAMPART_SYSTEM_PASSWORD}@postgres:5432/rampart?sslmode=disable"
      RAMPART_AUTH_BOOTSTRAP_ADMIN_TOKEN_FILE: "/var/lib/rampart/admin-token"
      # Browser sign-in (doc 14). Roles come from bindings, never straight from the IdP.
      RAMPART_SERVER_PUBLIC_URL: "http://localhost:8080"
      RAMPART_AUTH_OIDC_ISSUER: "http://localhost:5556/dex"
      RAMPART_AUTH_OIDC_CLIENT_ID: "rampart"
      RAMPART_AUTH_OIDC_CLIENT_SECRET_FILE: "/run/secrets/oidc_client_secret"
      RAMPART_AUTH_SESSION_KEY_FILE: "/run/secrets/session_key"
      RAMPART_AUTH_OIDC_DEFAULT_ROLE: "viewer"
      RAMPART_AUTH_OIDC_BINDINGS: "user:ada@example.com=admin"
      # The first administrator, created inside Rampart at first start (D3). With single sign-on
      # configured it would normally switch itself off; keepEnabled leaves it on for this quick start.
      RAMPART_AUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
      RAMPART_AUTH_BOOTSTRAP_ADMIN_KEEP_ENABLED: "true"
      RAMPART_OBJECT_STORAGE_ENDPOINT: "http://objectstore:8333"
      RAMPART_OBJECT_STORAGE_BUCKET_RAW: "rampart-raw-reports"
      RAMPART_SERVER_HTTP_ADDR: ":8080"
      RAMPART_SERVER_OPS_ADDR: ":9090"
      RAMPART_LOG_LEVEL: "info"
    secrets:
      - oidc_client_secret
      - session_key
      - admin_password
    # The issuer URL must be the same for the browser and for the server. Sharing the Dex network
    # namespace makes http://localhost:5556/dex reach Dex from inside this container too, so no
    # /etc/hosts entry is needed. (Ports are published on the dex service above.)
    network_mode: "service:dex"
    healthcheck:
      # Ready means the database is reachable (the ops port checks it).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/readyz"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      dex:
        condition: service_started
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy
    volumes:
      - ./resources:/etc/rampart/resources:ro
      - rampart-state:/var/lib/rampart

secrets:
  oidc_client_secret:
    environment: RAMPART_OIDC_CLIENT_SECRET
  session_key:
    environment: RAMPART_SESSION_KEY   # exactly 32 characters
  admin_password:
    environment: RAMPART_ADMIN_PASSWORD

volumes:
  pgdata:
  objectstore-data:
  rampart-state:

