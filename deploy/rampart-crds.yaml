              type: object
            spec:
              type: object
              description: ClusterSBOMParser configures an SBOM format reader (CycloneDX, SPDX, Syft).
              properties:
                format:
                  type: string
                  description: Canonical format identifier (cyclonedx, spdx, syft, openvex, csaf, custom).
                description:
                  type: string
                runtime:
                  type: string
                  enum: [wasm, lua, mapping]
                  default: wasm
                detect:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
