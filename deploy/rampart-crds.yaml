                    maxMemoryMB:
                      type: integer
                    timeoutSeconds:
                      type: integer
                options:
                  type: object
                  properties:
                    buildDependencyGraph:
                      type: boolean
                      default: true
                    extractVulnerabilities:
                      type: boolean
                      default: false
                      description: >-
                        Turn the vulnerabilities a document states (a CycloneDX VDR) into findings, besides filling
                        the inventory. Off by default: an SBOM is assets, and what is found in it is the matcher's work.
                        A format that states none (SPDX, Syft) is unaffected.
                    extractVEX:
                      type: boolean
                      default: false
                      description: >-
                        Extract exploitability assertions (VEX statements: status, justification, impact, action)
                        from the document (CycloneDX VEX/VDR, OpenVEX, or CSAF) and emit them in canonical format
                        for the Rampart matcher to suppress non-exploitable findings.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
