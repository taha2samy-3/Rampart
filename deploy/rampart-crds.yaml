        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                scannerFamily:
                  type: string
                type:
                  type: string
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - key
                ingestionPolicy:
                  type: object
                  properties:
                    minimumSeverity:
                      type: string
                    closeOldFindings:
                      type: boolean
                    closeScope:
                      type: string
                    doNotReactivate:
                      type: boolean
                    fieldMerge:
                      type: string
                    maxClosePercent:
                      type: number
                    minHeldClose:
                      type: integer
                    maxReportBytes:
                      type: integer
                    acceptedFormats:
                      type: array
                      items:
                        type: string
                trackedRefs:
                  type: array
                  maxItems: 50
                  description: >-
                    The branches whose runs change the inventory (D10). An exact name, a prefix ending in * ("release/*",
                    "hotfix-*"), or * for every ref. Any other ref is ephemeral: it feeds the CI gate and changes nothing.
                    Empty: main, master, default, release/*, prod, production. A pull request is always ephemeral.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: '^[^\s*]+\*?$|^\*$'
                trustRules:
                  type: array
                  items:
                    type: object
                    properties:
                      issuer:
                        type: string
                      provider:
                        type: string
                      repositoryId:
                        type: string
                      repositoryOwnerId:
                        type: string
                      projectId:
                        type: string
                      namespaceId:
                        type: string
                      repository:
                        type: string
                    required:
                      - issuer
                      - provider
                connector:
                  type: string
                  description: Name of a Connector of type dependencyTrack in this namespace; makes the source an apiPull source (docs/10 §8, D92).
                schedule:
                  type: string
                  description: Portfolio sync interval, a duration such as 30m or the cron form "*/N * * * *"; default 30m, at least 5m.
                dependencyTrack:
                  type: object
                  description: Projects, mapping, pull, webhook and triageSync (docs/10 §8). Validated by the operator, which refuses fields this version does not build.
                  x-kubernetes-preserve-unknown-fields: true
              required:
                - scannerFamily
            status:
              type: object
              properties:
                scanSourceId:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
