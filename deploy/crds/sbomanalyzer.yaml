apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sbomanalyzers.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: SBOMAnalyzer
    listKind: SBOMAnalyzerList
    plural: sbomanalyzers
    singular: sbomanalyzer
    shortNames:
      - sbomanalyzer
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Enabled, type: boolean, jsonPath: .spec.enabled}
        - {name: Engine, type: string, jsonPath: .spec.engine}
        - {name: MinConfidence, type: number, jsonPath: .spec.rules.minConfidence}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status"}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: SBOMAnalyzer configures the tenant-scoped native SBOM vulnerability matcher.
              properties:
                enabled:
                  type: boolean
                  default: true
                engine:
                  type: string
                  enum: [hybrid, osv, in-process, advisory-db]
                  default: hybrid
                description:
                  type: string
                rules:
                  type: object
                  properties:
                    minConfidence:
                      type: number
                      default: 0.8
                    includePreRelease:
                      type: boolean
                      default: false
                    matchDirectOnly:
                      type: boolean
                      default: false
                sources:
                  type: object
                  properties:
                    osv:
                      type: boolean
                      default: true
                    ghsa:
                      type: boolean
                      default: true
                    nvd:
                      type: boolean
                      default: false
                schedule:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
