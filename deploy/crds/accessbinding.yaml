apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: accessbindings.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: AccessBinding
    listKind: AccessBindingList
    plural: accessbindings
    singular: accessbinding
    shortNames:
      - rab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                Role binding for users, groups, or tokens on applications, hierarchy nodes, or tenant (docs/04, docs/07, docs/14).
              required:
                - role
                - subjects
              properties:
                role:
                  type: string
                  description: 'viewer | triager | maintainer | owner | admin | custom:<name>'
                subjects:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        type: string
                        enum: [User, Group, ServiceAccount]
                      idp:
                        type: string
                      name:
                        type: string
                      subject:
                        type: string
                scope:
                  type: object
                  properties:
                    tenant:
                      type: boolean
                    hierarchy:
                      type: array
                      items:
                        type: string
                    applications:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}

