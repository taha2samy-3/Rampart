apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scansources.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ScanSource
    listKind: ScanSourceList
    plural: scansources
    singular: scansource
    shortNames:
      - rpsrc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                scannerFamily:
                  type: string
                type:
                  type: string
                secretRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - key
              required:
                - scannerFamily
            status:
              type: object
              properties:
                scanSourceId:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}

