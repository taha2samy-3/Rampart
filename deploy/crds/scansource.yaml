apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scansources.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ScanSource
    listKind: ScanSourceList
    plural: scansources
    singular: scansource
    shortNames:
      - rpsrc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                applicationRef:
                  type: object
                  description: The target Application this ScanSource is exclusively bound to (D140). Can bind by name/slug, label selector, or repository URL.
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Name or slug of the target Application resource in this namespace.
                    selector:
                      type: object
                      description: Label selector to match target Application.
                      properties:
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                    repository:
                      type: string
                      maxLength: 500
                      description: Repository URL of the target Application (e.g. https://github.com/org/repo).
                categories:
                  type: array
                  description: >-
                    The security testing disciplines permitted for this source (D17).
                    Accepts one or more disciplines, or 'all'.
                  items:
                    type: string
                    enum:
                      - sast
                      - sca
                      - secret
                      - container
                      - dast
                      - iac
                      - cspm
                      - compliance
                      - license
                      - supply_chain
                      - all
                auth:
                  type: object
                  description: "Authentication contract: standard API token secretRef, single federation, and/or multiple OIDC federations."
                  properties:
                    tokenSecretRef:
                      type: object
                      description: Reference to a Kubernetes Secret containing a scoped ingest token for standard authentication.
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    federation:
                      type: object
                      description: Universal Workload Identity Federation via OIDC token exchange (RFC 8693).
                      required:
                        - issuer
                      properties:
                        issuer:
                          type: string
                          format: uri
                          description: "Trusted OIDC Issuer URL (e.g. https://token.actions.githubusercontent.com, https://sts.amazonaws.com)."
                        boundClaims:
                          type: object
                          description: "Key-value dictionary of claims required to match in the incoming JWT (e.g. repository_id, account_id)."
                          x-kubernetes-preserve-unknown-fields: true
                    federations:
                      type: array
                      description: Multiple Universal Workload Identity Federation rules for multi-issuer or multi-repo setups.
                      items:
                        type: object
                        required:
                          - issuer
                        properties:
                          issuer:
                            type: string
                            format: uri
                            description: "Trusted OIDC Issuer URL."
                          boundClaims:
                            type: object
                            description: "Key-value dictionary of claims required to match in the incoming JWT."
                            x-kubernetes-preserve-unknown-fields: true
                scannerFamily:
                  type: string
                  description: Legacy scanner family or parser ID; optional when categories is declared.
                type:
                  type: string
                  description: Ingestion mode (upload, apiPull, webhook, ci, manual).
                  default: upload
                  enum:
                    - upload
                    - apiPull
                    - webhook
                    - ci
                    - manual
                secretRef:
                  type: object
                  description: Legacy secret reference. Deprecated in favor of spec.auth.tokenSecretRef.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - key
                ingestionPolicy:
                  type: object
                  properties:
                    minimumSeverity:
                      type: string
                    closeOldFindings:
                      type: boolean
                    closeScope:
                      type: string
                    doNotReactivate:
                      type: boolean
                    fieldMerge:
                      type: string
                    maxClosePercent:
                      type: number
                    minHeldClose:
                      type: integer
                    maxReportBytes:
                      type: integer
                    acceptedFormats:
                      type: array
                      items:
                        type: string
                trackedRefs:
                  type: array
                  maxItems: 50
                  description: >-
                    Legacy tracked refs list. In modern Rampart, the production branch is inherited from the bound Application (D140).
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: '^[^\s*]+\*?$|^\*$'
                trustRules:
                  type: array
                  description: Legacy trust rules list. Deprecated in favor of spec.auth.federation.
                  items:
                    type: object
                    properties:
                      issuer:
                        type: string
                      provider:
                        type: string
                      repositoryId:
                        type: string
                      repositoryOwnerId:
                        type: string
                      projectId:
                        type: string
                      namespaceId:
                        type: string
                      repository:
                        type: string
                    required:
                      - issuer
                      - provider
                connector:
                  type: string
                  description: Name of a Connector of type dependencyTrack in this namespace; makes the source an apiPull source (docs/10 §8, D92).
                schedule:
                  type: string
                  description: Portfolio sync interval, a duration such as 30m or the cron form "*/N * * * *"; default 30m, at least 5m.
                dependencyTrack:
                  type: object
                  description: Projects, mapping, pull, webhook and triageSync (docs/10 §8). Validated by the operator, which refuses fields this version does not build.
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                scanSourceId:
                  type: string
                applicationId:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}
