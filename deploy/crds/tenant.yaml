apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
    shortNames:
      - rptn
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                displayName:
                  type: string
                namespaces:
                  description: Namespaces this tenant owns. The only binding between namespaces and a tenant (D20).
                  type: array
                  items:
                    type: string
                    maxLength: 63
                deletionPolicy:
                  description: >-
                    What deleting this resource does. Retain (default) refuses to delete a tenant that has data: the
                    resource stays, with Ready=False and reason DeletionBlocked. Purge deletes the tenant and everything
                    that belongs to it (D21).
                  type: string
                  enum: [Retain, Purge]
                  default: Retain
              required:
                - displayName
            status:
              type: object
              properties:
                tenantId:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                    required:
                      - type
                      - status
      subresources:
        status: {}

