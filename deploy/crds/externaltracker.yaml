apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externaltrackers.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ExternalTracker
    listKind: ExternalTrackerList
    plural: externaltrackers
    singular: externaltracker
    shortNames:
      - exttracker
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Protocol, type: string, jsonPath: .spec.protocol}
        - {name: Service, type: string, jsonPath: .spec.service.name}
        - {name: Port, type: integer, jsonPath: .spec.service.port}
        - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status"}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: ExternalTracker configures a tenant-scoped external ticketing microservice over gRPC.
              properties:
                enabled:
                  type: boolean
                  default: true
                protocol:
                  type: string
                  enum: [grpc, http]
                  default: grpc
                endpoint:
                  type: string
                  description: Rejected in tenant scope; use service instead to preserve SSRF isolation.
                service:
                  type: object
                  description: Kubernetes Service reference inside the tenant namespace or cluster.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    port:
                      type: integer
                timeoutSeconds:
                  type: integer
                  default: 30
                tls:
                  type: object
                  properties:
                    insecure:
                      type: boolean
                    caSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                auth:
                  type: object
                  properties:
                    secretRef:
                      type: object
                      properties:
                        name:
                          type: string
                        key:
                          type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
