apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusteraccessbindings.rampart.aspm.dev
spec:
  group: rampart.aspm.dev
  names:
    kind: ClusterAccessBinding
    listKind: ClusterAccessBindingList
    plural: clusteraccessbindings
    singular: clusteraccessbinding
    shortNames:
      - crab
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: >-
                Cluster-scoped role binding for platform roles across tenants (docs/04, docs/07, docs/14).
              required:
                - role
                - subjects
              properties:
                role:
                  type: string
                  description: 'platform-admin | admin | viewer | custom:<name>'
                subjects:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        type: string
                        enum: [User, Group, ServiceAccount]
                      idp:
                        type: string
                      name:
                        type: string
                      subject:
                        type: string
                scope:
                  type: object
                  properties:
                    allTenants:
                      type: boolean
                    tenants:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}

