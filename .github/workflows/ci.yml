name: CI & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job gets only what it needs. Jobs that sign or push say so below.
permissions:
  contents: read

env:
  # The Go version comes from go.mod so CI cannot drift from the code.
  GO_VERSION_FILE: go.mod

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"; echo "$UNFORMATTED"; exit 1
          fi
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # Built with this job's Go instead of downloading a release binary: a linter built with an older
      # Go refuses to load a module that targets a newer one (this is what broke the first CI run).
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

  # The Go suites run as separate jobs, in parallel, each with only the services it needs. Split by
  # dependency, not by size: a failure says at once whether code, the database or Kubernetes broke.
  test-unit:
    name: Tests - unit (no services)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Race detector, shuffled order
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v -e '/internal/store$' -e '/internal/operator$')
          go test -race -shuffle=on -parallel 4 -count=1 -coverprofile=coverage-unit.out -covermode=atomic "${pkgs[@]}"
      - uses: actions/upload-artifact@v4
        with: {name: coverage-unit, path: coverage-unit.out}

  test-store:
    name: Tests - PostgreSQL (RLS, merge, sessions, River)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rampart_owner
          POSTGRES_PASSWORD: rampart_password
          POSTGRES_DB: rampart
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rampart_owner -d rampart"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The owner URL. The tests derive the rampart_app and rampart_system URLs from it:
      # a superuser bypasses row-level security, so isolation is never tested as the owner.
      RAMPART_TEST_POSTGRES_URL: postgres://rampart_owner:rampart_password@127.0.0.1:5433/rampart?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Race detector
        run: go test -race -count=1 -v -coverprofile=coverage-store.out -covermode=atomic ./internal/store/ 2>&1 | tee /tmp/store.txt
      - name: A skipped suite is a failure in CI
        run: "! grep -q -- '--- SKIP' /tmp/store.txt"
      - uses: actions/upload-artifact@v4
        with: {name: coverage-store, path: coverage-store.out}

  test-operator:
    name: Tests - operator (real kube-apiserver and etcd)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Install kube-apiserver and etcd (envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use -p path)" >> "$GITHUB_ENV"
      - name: Race detector
        run: go test -race -count=1 -v -coverprofile=coverage-operator.out -covermode=atomic ./internal/operator/ 2>&1 | tee /tmp/operator.txt
      - name: A skipped suite is a failure in CI
        run: "! grep -q -- '--- SKIP' /tmp/operator.txt"
      - uses: actions/upload-artifact@v4
        with: {name: coverage-operator, path: coverage-operator.out}

  helm:
    name: Helm & CRDs
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Chart CRDs match deploy/crds
        run: diff -r deploy/crds deploy/helm/rampart/crds
      - name: helm lint
        run: helm lint deploy/helm/rampart
      - name: helm template (bundled CNPG and SeaweedFS)
        run: helm template t deploy/helm/rampart --namespace rampart > /dev/null
      - name: helm template (external database and S3)
        run: |
          helm template t deploy/helm/rampart \
            --set database.cnpg.enabled=false --set database.existingSecret=db \
            --set seaweedfs.enabled=false --set objectStorage.endpoint=https://s3.example.com > /dev/null
      - name: helm template (upgrade renders the pre-upgrade hook)
        run: |
          helm template t deploy/helm/rampart --is-upgrade | grep -q 'helm.sh/hook": pre-upgrade'

  web:
    name: Web UI
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --bun run typecheck
      - run: bun --bun run lint
      - run: bun --bun run test
      - run: bun --bun run build
      - name: Initial JS stays within 250 kB gzipped (doc 13 section 8)
        run: |
          size=$(for f in dist/assets/index-*.js; do gzip -c "$f" | wc -c; done | awk '{s+=$1} END{print s}')
          echo "initial JS: ${size} bytes gzipped"
          test "$size" -le 250000
      - name: index.html has no inline script or inline style (CSP)
        run: |
          if grep -Eq '<script(\s[^>]*)?>[^<]' dist/index.html; then echo "index.html has an inline script"; exit 1; fi
          if grep -Eq ' style="| on[a-z]+="' dist/index.html; then echo "index.html has an inline style or event handler"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    # Installs the Helm chart and exercises the operator on a throwaway kind cluster that exists only
    # inside this job. hack/e2e/kind.sh refuses to run against anything that is not a local kind cluster.
    name: Helm and operator on kind
    needs: [test-unit, test-store, test-operator, helm, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KO_DOCKER_REPO: kind.local
      KIND_CLUSTER_NAME: rampart-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: azure/setup-helm@v4
      - uses: ko-build/setup-ko@v0.8
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: helm/kind-action@v1
        with:
          cluster_name: rampart-e2e
      - name: Build the image straight into the kind node (the embedded UI is included)
        run: ko build --bare --tags e2e ./cmd/rampart
      - name: Install the chart and test the operator
        env:
          IMAGE_REPO: kind.local
          IMAGE_TAG: e2e
        run: hack/e2e/kind.sh
      - name: ShellCheck the e2e script
        if: always()
        run: shellcheck -S warning hack/e2e/kind.sh

  build:
    name: Build, SBOM
    needs: [test-unit, test-store, test-operator, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/rampart ./cmd/rampart
      - uses: ko-build/setup-ko@v0.8
      - name: ko build (local, no push)
        run: KO_DOCKER_REPO=ko.local ko build --bare ./cmd/rampart
      - uses: anchore/sbom-action/download-syft@v0.17.9
      - name: SBOM (CycloneDX and SPDX)
        run: |
          syft dir:. -o cyclonedx-json=bin/sbom.cdx.json
          syft dir:. -o spdx-json=bin/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: rampart-dist
          path: bin/

  publish:
    # Only on main: push the image by digest, sign it keyless with cosign, attach the SBOM
    # attestation (docs/15). SLSA provenance is produced by the next job.
    name: Publish & Sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, helm, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (OIDC)
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: ko-build/setup-ko@v0.8
      - uses: sigstore/cosign-installer@v3.7.0
      - uses: anchore/sbom-action/download-syft@v0.17.9
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: |
          REF=$(ko build --bare --tags "${GITHUB_SHA}" ./cmd/rampart)
          echo "image=${REF%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${REF#*@}" >> "$GITHUB_OUTPUT"
          echo "$REF" > image-ref.txt
      - name: Sign (keyless)
        run: cosign sign --yes "$(cat image-ref.txt)"
      - name: Attach SBOM attestation
        run: |
          syft "$(cat image-ref.txt)" -o cyclonedx-json=sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$(cat image-ref.txt)"

  provenance:
    name: SLSA provenance
    needs: publish
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
